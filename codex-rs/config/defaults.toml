# Fixed defaults for packaged Codex clients.
include_permissions_instructions = true
include_apps_instructions = true
include_collaboration_mode_instructions = true
include_environment_context = true
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "auto"
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []
background_terminal_max_timeout = 300000
file_opener = "vscode"
hide_agent_reasoning = false
chatgpt_base_url = "https://chatgpt.com/backend-api/"
project_root_markers = [".git"]
# Elpis: Elpis ships its own updater; never ask upstream for releases.
check_for_update_on_startup = false

[history]
persistence = "save-all"

# Elpis: product defaults. This is the lowest-precedence layer, so a user's own
# config.toml still wins. Keep config/src/loader/elpis_defaults_tests.rs in step.
[analytics]
enabled = false

[feedback]
enabled = false

[otel]
metrics_exporter = "none"

[features]
plugins = false
apps = false
tool_suggest = false
image_generation = false
daemon_auto_start = false
memories = false

[skills]
# Only skills the user turns on in [[skills.config]] reach the model.
default_enabled = false

[skills.bundled]
enabled = false

[shell_environment_policy]
exclude = ["CODEX_HOME"]

[tui]
fullscreen_transcript = false
# Elpis: no upstream startup tips; they advertise the Codex apps (v0.3.0 had none).
show_tooltips = false
