<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<rect x="0" y="0" width="1200" height="820" fill="#0d1117" rx="12" />
  <title id="title">Elpis provider-neutral architecture</title>
  <desc id="desc">Elpis owns context, memory, continuity, permissions, tools, and the TUI. A provider adapter translates the canonical response event stream to native OpenAI, Anthropic, and Gemini APIs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1621"/><stop offset="1" stop-color="#101b28"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="#718096"/></marker>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <text x="100" y="52" fill="#8ea2b8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">SYSTEM ARCHITECTURE</text>
  <text x="100" y="88" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="29" font-weight="700">Elpis owns the control plane</text>
  <text x="100" y="116" fill="#9aaabd" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16">Providers own inference; Elpis keeps the session, context, and tools coherent.</text>

  <g stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="600" y1="260" x2="600" y2="306"/>
    <path d="M600 456 L600 490 L240 490 L240 530"/>
    <path d="M600 490 L600 530"/>
    <path d="M600 490 L960 490 L960 530"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <rect x="140" y="160" width="920" height="100" rx="16" fill="#15343d" stroke="#39c6d8" stroke-width="2"/>
    <circle cx="180" cy="210" r="16" fill="#39c6d8"/>
    <text x="180" y="216" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">1</text>
    <text x="220" y="204" fill="#f4f7fb" font-size="21" font-weight="700">Elpis TUI / control plane</text>
    <text x="220" y="232" fill="#b5e8ed" font-size="14">Context · memory · continuity · permissions · tool execution</text>

    <rect x="140" y="306" width="920" height="100" rx="16" fill="#15343d" stroke="#39c6d8" stroke-width="2"/>
    <circle cx="180" cy="356" r="16" fill="#39c6d8"/>
    <text x="180" y="362" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">2</text>
    <text x="220" y="350" fill="#f4f7fb" font-size="21" font-weight="700">Provider adapter layer</text>
    <text x="220" y="378" fill="#b5e8ed" font-size="14">Canonical ResponseEvent ↔ vendor-native request and stream formats</text>

    <rect x="80" y="530" width="320" height="120" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <text x="112" y="574" fill="#f4f7fb" font-size="19" font-weight="700">OpenAI</text>
    <text x="112" y="602" fill="#a7b5c5" font-size="14">Responses API</text>
    <text x="112" y="626" fill="#a7b5c5" font-size="13">api.openai.com/v1</text>

    <rect x="440" y="530" width="320" height="120" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <text x="472" y="574" fill="#f4f7fb" font-size="19" font-weight="700">Anthropic</text>
    <text x="472" y="602" fill="#a7b5c5" font-size="14">Messages API</text>
    <text x="472" y="626" fill="#a7b5c5" font-size="13">api.anthropic.com/v1</text>

    <rect x="800" y="530" width="320" height="120" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <text x="832" y="574" fill="#f4f7fb" font-size="19" font-weight="700">Google Gemini</text>
    <text x="832" y="602" fill="#a7b5c5" font-size="14">GenerateContent API</text>
    <text x="832" y="626" fill="#a7b5c5" font-size="13">generativelanguage.googleapis.com</text>

    <rect x="140" y="710" width="920" height="58" rx="14" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <text x="600" y="746" fill="#a7b5c5" font-size="14" text-anchor="middle">Provider switching changes inference, not Elpis workspace context, checkpoints, or memory.</text>
  </g>
</svg>
