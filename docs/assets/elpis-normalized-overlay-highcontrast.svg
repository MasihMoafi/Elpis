<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="570" viewBox="0 0 1140 570" style="background-color: #0d1117; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<title>Historical normalized context trajectories for three paired runs</title>
<desc>Codex and Elpis context-window utilization across three repetitions of one identical task, normalized to each run's request sequence. The measurements come from a superseded high-frequency automatic-pruning configuration and do not describe current Elpis defaults.</desc>
<rect x="0" y="0" width="1140" height="570" fill="#0d1117" rx="12" />
  <rect x="45" y="16" width="476" height="28" rx="14" fill="#2b1d12" stroke="#d97706" stroke-width="1"/>
  <text x="61" y="35" fill="#fbbf24" font-size="12.5" font-weight="700">Historical - superseded automatic-pruning configuration</text>
  <text x="1095" y="35" fill="#94a3b8" font-size="12.5" text-anchor="end">Three repetitions of one identical task</text>
<g transform="translate(0 44)">
  <!-- Header -->
  <text x="45" y="42" fill="#f8fafc" font-size="22" font-weight="700">Normalized Task-Progress View (0%–100% Sequence Overlay)</text>
  <text x="45" y="68" fill="#94a3b8" font-size="14">Each run normalized to 0–100% of its own request sequence · gpt-5.6-luna · commit 646c94a3</text>

  <!-- Legend -->
  <g transform="translate(45, 88)">
    <circle cx="7" cy="7" r="6" fill="#38bdf8"/>
    <text x="20" y="12" fill="#f8fafc" font-size="13.5" font-weight="700">Codex</text>

    <circle cx="105" cy="7" r="6" fill="#34d399"/>
    <text x="118" y="12" fill="#f8fafc" font-size="13.5" font-weight="700">Elpis</text>

    <line x1="190" y1="7" x2="220" y2="7" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="228" y="12" fill="#cbd5e1" font-size="13">Run 1 (solid)</text>

    <line x1="335" y1="7" x2="365" y2="7" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="373" y="12" fill="#cbd5e1" font-size="13">Run 2 (dashed)</text>

    <line x1="485" y1="7" x2="515" y2="7" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="2 2"/>
    <text x="523" y="12" fill="#cbd5e1" font-size="13">Run 3 (dotted)</text>
  </g>

  <!-- Context Health Zones: Green (0-20%), Yellow (20-30%), Orange (30-70%), Red (70-100%) -->
  <!-- 0% - 20%: Green (Safe Band) -->
  <rect x="75" y="366.0" width="995" height="64.0" fill="#10b981" fill-opacity="0.14"/>
  <!-- 20% - 30%: Yellow (Target Prune Band) -->
  <rect x="75" y="334.0" width="995" height="32.0" fill="#eab308" fill-opacity="0.12"/>
  <!-- 30% - 70%: Orange (Pressure Band) -->
  <rect x="75" y="206.0" width="995" height="128.0" fill="#f97316" fill-opacity="0.10"/>
  <!-- 70% - 100%: Red (Critical Danger Zone) -->
  <rect x="75" y="110" width="995" height="96.0" fill="#ef4444" fill-opacity="0.12"/>

  <!-- Grid Lines -->
  <line x1="75" y1="430" x2="1070" y2="430" stroke="#334155" stroke-width="1"/>
  <text x="63" y="434" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">0%</text>

  <line x1="75" y1="366.0" x2="1070" y2="366.0" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="63" y="370.0" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">20%</text>

  <line x1="75" y1="334.0" x2="1070" y2="334.0" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="63" y="338.0" fill="#f87171" font-size="13" font-weight="700" text-anchor="end">30%</text>

  <line x1="75" y1="238.0" x2="1070" y2="238.0" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="63" y="242.0" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">60%</text>

  <line x1="75" y1="206.0" x2="1070" y2="206.0" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="63" y="210.0" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">70%</text>

  <line x1="75" y1="110" x2="1070" y2="110" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="63" y="114" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">100%</text>

  <!-- 30% Pressure Label on the LEFT SIDE -->
  <rect x="93" y="310.0" width="200" height="22" rx="4" fill="#1c1315" stroke="#ef4444" stroke-width="1.2"/>
  <text x="193" y="325.0" fill="#f87171" font-size="12.5" font-weight="700" text-anchor="middle">30% Ace Pressure Trigger</text>

