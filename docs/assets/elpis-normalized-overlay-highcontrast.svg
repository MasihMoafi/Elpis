  <polyline points="75.0,407.5 92.2,402.8 109.3,389.7 126.5,383.4 143.6,383.2 160.8,368.2 177.9,354.8 195.1,340.2 212.2,349.1 229.4,332.6 246.6,351.8 263.7,335.6 280.9,347.9 298.0,334.3 315.2,343.1 332.3,358.7 349.5,347.6 366.6,335.3 383.8,352.9 400.9,339.4 418.1,353.9 435.3,343.8 452.4,330.2 469.6,320.0 486.7,307.6 503.9,294.8 521.0,299.7 538.2,400.7 555.3,388.8 572.5,378.1 589.7,368.2 606.8,357.6 624.0,345.3 641.1,339.5 658.3,354.1 675.4,340.2 692.6,347.0 709.7,342.7 726.9,352.9 744.1,339.1 761.2,326.6 778.4,312.2 795.5,299.8 812.7,287.5 829.8,281.9 847.0,271.6 864.1,288.0 881.3,397.5 898.4,383.8 915.6,370.8 932.8,362.2 949.9,348.9 967.1,335.9 984.2,323.3 1001.4,314.3 1018.5,299.8 1035.7,289.8 1052.8,301.3 1070.0,398.3" fill="none" stroke="#34d399" stroke-width="3.0" stroke-dasharray="7 4"/>
