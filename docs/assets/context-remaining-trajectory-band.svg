<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img">
  <rect width="100%" height="100%" fill="#0b0f14"/>

  <!-- Title & Legend -->
  <text x="44" y="48" fill="#f5f7fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">Trajectory Band &amp; Configurable Pruning Threshold</text>
  <text x="44" y="74" fill="#9aa4b2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">Shaded min-max range bands · Pressure pruning triggers at Turn 2 to lock floor above 65.0%</text>

  <circle cx="720" cy="45" r="6" fill="#22d3ee"/>
  <text x="732" y="49" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">Elpis Band</text>

  <circle cx="830" cy="45" r="6" fill="#f59e0b"/>
  <text x="842" y="49" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">Prune Event</text>

  <circle cx="970" cy="45" r="6" fill="#64748b"/>
  <text x="982" y="49" fill="#9aa4b2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Codex Band</text>

  <!-- Chart Area Bounds: X: 120 -> 1020, Y: 120 -> 570 (Height 450px = 100%) -->
  <!-- Formula: Y = 570 - (Val * 4.5) -->

  <!-- Grid lines -->
  <g stroke="#1b2530" stroke-width="1">
    <line x1="120" y1="151.5" x2="1020" y2="151.5"/> <!-- 93% Ceiling -->
    <line x1="120" y1="232.5" x2="1020" y2="232.5"/> <!-- 75% -->
    <line x1="120" y1="345.0" x2="1020" y2="345.0"/> <!-- 50% -->
    <line x1="120" y1="457.5" x2="1020" y2="457.5"/> <!-- 25% -->
    <line x1="120" y1="570.0" x2="1020" y2="570.0"/> <!-- 0% -->
  </g>

  <!-- Hard Ceiling Line 93% -->
  <line x1="120" y1="151.5" x2="1020" y2="151.5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="110" y="155" fill="#ef4444" font-family="ui-monospace,monospace" font-size="11" text-anchor="end">93.0% Max Cap</text>

  <!-- Pruning Floor Line 65% (Y = 570 - 292.5 = 277.5) -->
  <line x1="120" y1="277.5" x2="1020" y2="277.5" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="110" y="281" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="end">65.0% Floor</text>

  <text x="110" y="349" fill="#64748b" font-family="ui-monospace,monospace" font-size="11" text-anchor="end">50.0%</text>
  <text x="110" y="461" fill="#64748b" font-family="ui-monospace,monospace" font-size="11" text-anchor="end">25.0%</text>

  <!-- X Axes -->
  <text x="220" y="610" fill="#c8d0da" font-family="ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle">Turn 1</text>
  <text x="570" y="610" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle">Turn 2 (Pruned)</text>
  <text x="920" y="610" fill="#c8d0da" font-family="ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle">Turn 3</text>

  <!-- CODEX BAND: T1(54.2-68.2%), T2(28.4-48.2%), T3(15.4-25.2%) -->
  <!-- Top Y: T1=263.1, T2=353.1, T3=456.6 -->
  <!-- Bot Y: T1=326.1, T2=442.2, T3=500.7 -->
  <polygon points="220,263.1 570,353.1 920,456.6 920,500.7 570,442.2 220,326.1" fill="#64748b" fill-opacity="0.18"/>
  <path d="M 220,263.1 L 570,353.1 L 920,456.6" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 220,326.1 L 570,442.2 L 920,500.7" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- ELPIS BAND: T1(83.4-91.2%), T2(72.2-87.2%), T3(66.4-78.2%) -->
  <!-- Top Y: T1=159.6, T2=177.6, T3=218.1 -->
  <!-- Bot Y: T1=194.7, T2=245.1, T3=271.2 -->
  <polygon points="220,159.6 570,177.6 920,218.1 920,271.2 570,245.1 220,194.7" fill="#22d3ee" fill-opacity="0.15"/>
  <path d="M 220,159.6 L 570,177.6 L 920,218.1" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M 220,194.7 L 570,245.1 L 920,271.2" fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- Elpis Pressure Prune Node at Turn 2 -->
  <circle cx="570" cy="245.1" r="8" fill="#f59e0b" stroke="#0b0f14" stroke-width="2"/>
  <text x="570" y="230" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">72.2% Min Floor</text>

  <!-- Labels on Nodes -->
  <!-- T1 Elpis -->
  <text x="220" y="145" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle">83.4% – 91.2%</text>
  <!-- T3 Elpis -->
  <text x="920" y="200" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle">66.4% – 78.2%</text>

  <!-- T1 Codex -->
  <text x="220" y="346" fill="#9aa4b2" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">54.2% – 68.2%</text>
  <!-- T2 Codex -->
  <text x="570" y="462" fill="#9aa4b2" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">28.4% – 48.2%</text>
  <!-- T3 Codex -->
  <text x="920" y="520" fill="#ef4444" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">15.4% – 25.2%</text>
</svg>
