<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img">
  <rect width="100%" height="100%" fill="#0b0f14"/>

  <!-- Title & Legend -->
  <text x="44" y="48" fill="#f5f7fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">Context Memory Retention Ranges</text>
  <text x="44" y="74" fill="#9aa4b2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">Model comparison across 3 turns · Maximum ceiling capped at 93.0% system prompt limit</text>

  <circle cx="720" cy="45" r="6" fill="#22d3ee"/>
  <text x="732" y="49" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">Elpis</text>

  <circle cx="810" cy="45" r="6" fill="#f59e0b"/>
  <text x="822" y="49" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">Elpis (Pressure Pruned)</text>

  <circle cx="1000" cy="45" r="6" fill="#64748b"/>
  <text x="1012" y="49" fill="#9aa4b2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Codex</text>

  <!-- ================= TURN 1 ================= -->
  <g transform="translate(44, 110)">
    <rect width="330" height="600" rx="8" fill="#111923" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="165" y="36" fill="#f5f7fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" text-anchor="middle">TURN 1</text>
    <line x1="20" y1="52" x2="310" y2="52" stroke="#1b2530"/>

    <!-- Y Scale Grid (0% at y=540, 100% at y=90) -->
    <line x1="50" y1="90" x2="300" y2="90" stroke="#1b2530" stroke-dasharray="2 2"/>
    <text x="42" y="94" fill="#64748b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">100%</text>

    <line x1="50" y1="225" x2="300" y2="225" stroke="#f59e0b" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <text x="42" y="229" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">70%</text>

    <line x1="50" y1="315" x2="300" y2="315" stroke="#1b2530" stroke-dasharray="2 2"/>
    <text x="42" y="319" fill="#64748b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">50%</text>

    <!-- ELPIS Range: 83.4% (y=165) to 91.2% (y=130) | Mean: 87.3% (y=147) -->
    <rect x="95" y="130" width="40" height="35" rx="4" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="2"/>
    <line x1="115" y1="130" x2="115" y2="165" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="115" cy="147" r="5" fill="#22d3ee"/>
    <text x="115" y="118" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">83.4% – 91.2%</text>
    <text x="115" y="182" fill="#f5f7fa" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">Mean: 87.3%</text>
    <text x="115" y="520" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle">ELPIS</text>

    <!-- CODEX Range: 54.2% (y=296) to 68.2% (y=233) | Mean: 61.2% (y=264) -->
    <rect x="205" y="233" width="40" height="63" rx="4" fill="#64748b" fill-opacity="0.25" stroke="#64748b" stroke-width="2"/>
    <line x1="225" y1="233" x2="225" y2="296" stroke="#64748b" stroke-width="3"/>
    <circle cx="225" cy="264" r="5" fill="#64748b"/>
    <text x="225" y="221" fill="#9aa4b2" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">54.2% – 68.2%</text>
    <text x="225" y="313" fill="#c8d0da" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">Mean: 61.2%</text>
    <text x="225" y="520" fill="#9aa4b2" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">CODEX</text>
  </g>

  <!-- ================= TURN 2 (PRUNED) ================= -->
  <g transform="translate(395, 110)">
    <rect width="330" height="600" rx="8" fill="#111923" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="165" y="36" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" text-anchor="middle">TURN 2 (PRESSURE PRUNED)</text>
    <line x1="20" y1="52" x2="310" y2="52" stroke="#1b2530"/>

    <line x1="50" y1="90" x2="300" y2="90" stroke="#1b2530" stroke-dasharray="2 2"/>
    <text x="42" y="94" fill="#64748b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">100%</text>

    <line x1="50" y1="225" x2="300" y2="225" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="42" y="229" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="end">70%</text>

    <line x1="50" y1="315" x2="300" y2="315" stroke="#1b2530" stroke-dasharray="2 2"/>
    <text x="42" y="319" fill="#64748b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">50%</text>

    <!-- ELPIS (PRUNED) Range: 72.2% (y=215) to 87.2% (y=148) | Mean: 79.7% (y=181) -->
    <rect x="95" y="148" width="40" height="67" rx="4" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
    <line x1="115" y1="148" x2="115" y2="215" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="115" cy="181" r="5" fill="#f59e0b"/>
    <text x="115" y="136" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">72.2% – 87.2%</text>
    <text x="115" y="232" fill="#f5f7fa" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">Mean: 79.7%</text>
    <text x="115" y="520" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle">ELPIS</text>

    <!-- CODEX Range: 28.4% (y=412) to 48.2% (y=323) | Mean: 38.3% (y=368) -->
    <rect x="205" y="323" width="40" height="89" rx="4" fill="#64748b" fill-opacity="0.25" stroke="#64748b" stroke-width="2"/>
    <line x1="225" y1="323" x2="225" y2="412" stroke="#64748b" stroke-width="3"/>
    <circle cx="225" cy="368" r="5" fill="#64748b"/>
    <text x="225" y="311" fill="#9aa4b2" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">28.4% – 48.2%</text>
    <text x="225" y="429" fill="#c8d0da" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">Mean: 38.3%</text>
    <text x="225" y="520" fill="#9aa4b2" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">CODEX</text>
  </g>

  <!-- ================= TURN 3 ================= -->
  <g transform="translate(746, 110)">
    <rect width="330" height="600" rx="8" fill="#111923" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="165" y="36" fill="#ef4444" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" text-anchor="middle">TURN 3 (COMPACTION)</text>
    <line x1="20" y1="52" x2="310" y2="52" stroke="#1b2530"/>

    <line x1="50" y1="90" x2="300" y2="90" stroke="#1b2530" stroke-dasharray="2 2"/>
    <text x="42" y="94" fill="#64748b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">100%</text>

    <line x1="50" y1="225" x2="300" y2="225" stroke="#f59e0b" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <text x="42" y="229" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">70%</text>

    <line x1="50" y1="315" x2="300" y2="315" stroke="#1b2530" stroke-dasharray="2 2"/>
    <text x="42" y="319" fill="#64748b" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">50%</text>

    <!-- ELPIS Range: 66.4% (y=241) to 78.2% (y=188) | Mean: 72.3% (y=215) -->
    <rect x="95" y="188" width="40" height="53" rx="4" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="2"/>
    <line x1="115" y1="188" x2="115" y2="241" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="115" cy="215" r="5" fill="#22d3ee"/>
    <text x="115" y="176" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">66.4% – 78.2%</text>
    <text x="115" y="258" fill="#f5f7fa" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">Mean: 72.3%</text>
    <text x="115" y="520" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle">ELPIS</text>

    <!-- CODEX Range: 15.4% (y=471) to 25.2% (y=427) | Mean: 20.3% (y=449) -->
    <rect x="205" y="427" width="40" height="44" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
    <line x1="225" y1="427" x2="225" y2="471" stroke="#ef4444" stroke-width="3"/>
    <circle cx="225" cy="449" r="5" fill="#ef4444"/>
    <text x="225" y="415" fill="#ef4444" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">15.4% – 25.2%</text>
    <text x="225" y="488" fill="#ef4444" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">Mean: 20.3%</text>
    <text x="225" y="520" fill="#ef4444" font-family="ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle">CODEX</text>
  </g>
</svg>
