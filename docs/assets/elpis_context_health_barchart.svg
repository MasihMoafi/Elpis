<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" style="background-color: #0d1117; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <text x="36" y="38" fill="#f8fafc" font-size="18" font-weight="700">Task 1: Context Health Zone Distribution (Elpis vs. Codex)</text>
  <text x="36" y="60" fill="#94a3b8" font-size="13">Proportion of request turns spent in Healthy (&#8804;30%), Pressure (30%–70%), and Critical Danger (&gt;70%) context zones across 3 paired runs.</text>

  <!-- Legend -->
  <g transform="translate(36, 85)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="22" y="12" fill="#f8fafc" font-size="12" font-weight="600">Healthy Operating Band (&#8804;30% Window)</text>

    <rect x="290" y="0" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="312" y="12" fill="#f8fafc" font-size="12" font-weight="600">Warning / Pressure Band (30%–70%)</text>

    <rect x="570" y="0" width="14" height="14" rx="3" fill="#ef4444"/>
    <text x="592" y="12" fill="#f8fafc" font-size="12" font-weight="600">Critical Danger Band (&gt;70% Bloat)</text>
  </g>

  <!-- Section 1: Codex Baseline Arm -->
  <text x="36" y="135" fill="#f87171" font-size="14" font-weight="700">CODEX BASELINE ARM (Unmanaged Transcripts)</text>

  <!-- Codex Run 1 -->
  <g transform="translate(36, 150)">
    <text x="0" y="24" fill="#cbd5e1" font-size="12" font-weight="600">Run 1 (103 reqs)</text>
    <!-- Bar width total: 700px (100%) -->
    <rect x="140" y="6" width="152" height="26" rx="3" fill="#10b981"/>
    <text x="216" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">21.7%</text>

    <rect x="294" y="6" width="305" height="26" rx="3" fill="#f59e0b"/>
    <text x="446" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">43.5%</text>

    <rect x="601" y="6" width="243" height="26" rx="3" fill="#ef4444"/>
    <text x="722" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">34.8% (Danger)</text>
  </g>

  <!-- Codex Run 2 -->
  <g transform="translate(36, 186)">
    <text x="0" y="24" fill="#cbd5e1" font-size="12" font-weight="600">Run 2 (59 reqs)</text>
    <rect x="140" y="6" width="166" height="26" rx="3" fill="#10b981"/>
    <text x="223" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">23.7%</text>

    <rect x="308" y="6" width="321" height="26" rx="3" fill="#f59e0b"/>
    <text x="468" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">45.8%</text>

    <rect x="631" y="6" width="213" height="26" rx="3" fill="#ef4444"/>
    <text x="737" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">30.5% (Danger)</text>
  </g>

  <!-- Codex Run 3 -->
  <g transform="translate(36, 222)">
    <text x="0" y="24" fill="#cbd5e1" font-size="12" font-weight="600">Run 3 (60 reqs)</text>
    <rect x="140" y="6" width="152" height="26" rx="3" fill="#10b981"/>
    <text x="216" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">21.7%</text>

    <rect x="294" y="6" width="327" height="26" rx="3" fill="#f59e0b"/>
    <text x="457" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">46.7%</text>

    <rect x="623" y="6" width="221" height="26" rx="3" fill="#ef4444"/>
    <text x="733" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">31.7% (Danger)</text>
  </g>

  <!-- Section 2: Elpis Arm -->
  <text x="36" y="295" fill="#34d399" font-size="14" font-weight="700">ELPIS ARM (Ace Sovereign Context Governance)</text>

  <!-- Elpis Run 1 -->
  <g transform="translate(36, 310)">
    <text x="0" y="24" fill="#cbd5e1" font-size="12" font-weight="600">Run 1 (103 reqs)</text>
    <rect x="140" y="6" width="612" height="26" rx="3" fill="#10b981"/>
    <text x="446" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">87.4% (Optimal Green Band)</text>

    <rect x="754" y="6" width="88" height="26" rx="3" fill="#f59e0b"/>
    <text x="798" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">12.6%</text>

    <text x="850" y="23" fill="#94a3b8" font-size="11">0% Danger</text>
  </g>

  <!-- Elpis Run 2 -->
  <g transform="translate(36, 346)">
    <text x="0" y="24" fill="#cbd5e1" font-size="12" font-weight="600">Run 2 (59 reqs)</text>
    <rect x="140" y="6" width="605" height="26" rx="3" fill="#10b981"/>
    <text x="442" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">86.4% (Optimal Green Band)</text>

    <rect x="747" y="6" width="95" height="26" rx="3" fill="#f59e0b"/>
    <text x="794" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">13.6%</text>

    <text x="850" y="23" fill="#94a3b8" font-size="11">0% Danger</text>
  </g>

  <!-- Elpis Run 3 -->
  <g transform="translate(36, 382)">
    <text x="0" y="24" fill="#cbd5e1" font-size="12" font-weight="600">Run 3 (60 reqs)</text>
    <rect x="140" y="6" width="618" height="26" rx="3" fill="#10b981"/>
    <text x="449" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">88.3% (Optimal Green Band)</text>

    <rect x="760" y="6" width="82" height="26" rx="3" fill="#f59e0b"/>
    <text x="801" y="23" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">11.7%</text>

    <text x="850" y="23" fill="#94a3b8" font-size="11">0% Danger</text>
  </g>

  <!-- Summary Footer Card -->
  <g transform="translate(36, 435)">
    <rect width="928" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="25" fill="#f8fafc" font-size="12" font-weight="700">Summary Finding:</text>
    <text x="140" y="25" fill="#cbd5e1" font-size="12">Elpis operates in the healthy green zone for <tspan fill="#34d399" font-weight="700">87.4% – 88.3%</tspan> of requests with <tspan fill="#34d399" font-weight="700">0%</tspan> in the danger zone.</text>
    <text x="140" y="44" fill="#94a3b8" font-size="12">In contrast, Codex spends <tspan fill="#f87171" font-weight="700">76.3% – 78.3%</tspan> of all requests under severe context pressure and dangerous bloat.</text>
  </g>
</svg>