<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elpis Work Graph</title>
<style>
:root{--bg:#071014;--panel:#0b171c;--node:#0e1d23;--line:#24414a;--text:#e7f7fb;--muted:#7f9ca5;--cyan:#54d8f0;--green:#5ee6a8;--amber:#f3c969}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.shell{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:18px;margin:0}.sub,.meta{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}.primary{background:var(--cyan);border-color:var(--cyan);color:#041014;font-weight:750}.layout{display:grid;grid-template-columns:1fr 280px;gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:11px}.graph{position:relative;min-height:560px;padding:30px 22px;overflow:auto;background-image:radial-gradient(#17323a 1px,transparent 1px);background-size:22px 22px}.columns{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:44px;min-width:760px}.column{display:flex;flex-direction:column;gap:20px}.stage{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.node{min-height:108px;padding:13px;border:1px solid var(--line);background:var(--node);border-radius:12px;cursor:pointer}.node.selected{outline:2px solid #54d8f055;border-color:var(--cyan)}.node.running{border-color:var(--amber)}.node.succeeded{border-color:var(--green)}.top{display:flex;justify-content:space-between}.kind{color:var(--cyan);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.1em}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.running .dot{background:var(--amber)}.succeeded .dot{background:var(--green)}h3{font-size:13px;margin:10px 0 6px}.tag{display:inline-block;margin:9px 4px 0 0;padding:3px 6px;border-radius:6px;background:#10272e;color:#9bb6be;font-size:10px}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{stroke:var(--line);stroke-width:2;fill:none}.side{padding:16px}.kv{padding:10px 0;border-top:1px solid var(--line)}.label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.value{margin-top:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{border:1px solid var(--line);background:var(--node);padding:10px;border-radius:10px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:10px}footer{margin-top:10px;color:var(--muted);font-size:11px}@media(max-width:800px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column;gap:12px}}
</style>
</head>
<body>
<div class="shell">
<header><div><h1>Elpis Work Graph</h1><div class="sub">The model creates the DAG. Elpis validates, schedules, limits, and verifies it.</div></div><div class="actions"><button id="reset">Reset</button><button class="primary" id="advance">Run next</button></div></header>
<div class="layout">
<section class="card"><div class="head"><div><b>Context continuity upgrade</b><div class="sub">max concurrency 2 · primary environment</div></div><span class="pill" id="graphStatus">pending</span></div><div class="graph" id="graph"><svg class="edges" id="edges"></svg><div class="columns" id="columns"></div></div></section>
<aside class="card"><div class="head"><b>Task evidence</b></div><div class="side"><div class="stats"><div class="stat"><b id="done">0</b><span>completed</span></div><div class="stat"><b id="ready">2</b><span>ready</span></div></div><div id="details"></div></div></aside>
</div><footer>This page renders task data and dependencies; it does not encode a fixed execution loop.</footer>
</div>
<script>
const seed=[
{id:'inspect_context',title:'Inspect context lifecycle',kind:'explore',depends:[],scope:'read-only',accept:'Find the smallest real gap.',status:'pending'},
{id:'inspect_ui',title:'Inspect /agent visibility',kind:'explore',depends:[],scope:'read-only',accept:'Identify missing graph evidence.',status:'pending'},
{id:'implement_context',title:'Implement bounded context fix',kind:'implement',depends:['inspect_context'],scope:'codex-rs/core',accept:'Focused core checks pass.',status:'pending'},
{id:'implement_ui',title:'Expose graph evidence clearly',kind:'implement',depends:['inspect_ui'],scope:'codex-rs/tui',accept:'Snapshot test passes.',status:'pending'},
{id:'verify_context',title:'Verify context behavior',kind:'verify',depends:['implement_context'],scope:'read-only',accept:'Independent reproduction passes.',status:'pending'},
{id:'verify_ui',title:'Verify /agent output',kind:'verify',depends:['implement_ui'],scope:'read-only',accept:'Evidence is visible and accurate.',status:'pending'},
{id:'acceptance',title:'Final acceptance review',kind:'verify',depends:['verify_context','verify_ui'],scope:'read-only',accept:'No unchecked critical work.',status:'pending'}];
let tasks=structuredClone(seed),selected=tasks[0].id;
function level(t,m={}){if(m[t.id]!=null)return m[t.id];return m[t.id]=t.depends.length?1+Math.max(...t.depends.map(id=>level(tasks.find(x=>x.id===id),m))):0}
function ready(){return tasks.filter(t=>t.status==='pending'&&t.depends.every(id=>tasks.find(x=>x.id===id).status==='succeeded'))}
function render(){const cols=document.querySelector('#columns'),max=Math.max(...tasks.map(t=>level(t)));cols.style.gridTemplateColumns=`repeat(${max+1},minmax(145px,1fr))`;cols.innerHTML='';for(let i=0;i<=max;i++){const c=document.createElement('div');c.className='column';c.innerHTML=`<div class="stage">${['Discover','Build','Verify','Accept'][i]||'Stage'}</div>`;tasks.filter(t=>level(t)===i).forEach(t=>{const n=document.createElement('article');n.className=`node ${t.status} ${selected===t.id?'selected':''}`;n.dataset.id=t.id;n.innerHTML=`<div class="top"><span class="kind">${t.kind}</span><span class="dot"></span></div><h3>${t.title}</h3><div class="meta">${t.status} · ${t.id}</div><span class="tag">${t.scope}</span>`;n.onclick=()=>{selected=t.id;render()};c.appendChild(n)});cols.appendChild(c)}requestAnimationFrame(edges);details();document.querySelector('#done').textContent=tasks.filter(t=>t.status==='succeeded').length;document.querySelector('#ready').textContent=ready().length;document.querySelector('#graphStatus').textContent=tasks.every(t=>t.status==='succeeded')?'succeeded':tasks.some(t=>t.status==='running')?'running':tasks.some(t=>t.status==='succeeded')?'in progress':'pending'}
function edges(){const svg=document.querySelector('#edges'),g=document.querySelector('#graph').getBoundingClientRect();svg.innerHTML='<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#24414a"/></marker></defs>';tasks.forEach(t=>t.depends.forEach(id=>{const a=document.querySelector(`[data-id="${id}"]`).getBoundingClientRect(),b=document.querySelector(`[data-id="${t.id}"]`).getBoundingClientRect(),x1=a.right-g.left,y1=a.top+a.height/2-g.top,x2=b.left-g.left,y2=b.top+b.height/2-g.top,m=(x1+x2)/2,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`);p.setAttribute('class','edge');p.setAttribute('marker-end','url(#a)');svg.appendChild(p)}))}
function details(){const t=tasks.find(x=>x.id===selected);document.querySelector('#details').innerHTML=`<h3>${t.title}</h3><div class="kv"><div class="label">Role</div><div class="value">${t.kind}</div></div><div class="kv"><div class="label">Dependencies</div><div class="value">${t.depends.join(', ')||'none'}</div></div><div class="kv"><div class="label">Write authority</div><div class="value">${t.scope}</div></div><div class="kv"><div class="label">Acceptance</div><div class="value">${t.accept}</div></div>`}
function advance(){const running=tasks.filter(t=>t.status==='running');if(running.length)running.forEach(t=>t.status='succeeded');else{const batch=[];for(const t of ready()){if(t.scope!=='read-only'&&batch.some(x=>x.scope!=='read-only'))continue;batch.push(t);if(batch.length===2)break}batch.forEach(t=>t.status='running')}render()}
document.querySelector('#advance').onclick=advance;document.querySelector('#reset').onclick=()=>{tasks=structuredClone(seed);selected=tasks[0].id;render()};addEventListener('resize',edges);render();
</script>
</body>
</html>
