name: Prune hang probe

on:
  push:
    branches:
      - ci/prune-hang-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Run each prune test under a hard timeout
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CODEX_SKIP_BWRAP_BUILD: "1"
      # Mirrors codex-rs/.cargo/config.toml [env], which cargo applies to test binaries.
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Linux build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap libcap-dev libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        working-directory: codex-rs
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component rustfmt --no-self-update

      - name: Build the codex-core integration test binary
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --lib --locked --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="codex-app-server" and (.target.kind|index("lib")) and .executable!=null) | .executable' \
            > "$RUNNER_TEMP/test-binary"
          test -s "$RUNNER_TEMP/test-binary"
          cat "$RUNNER_TEMP/test-binary"

      - name: Run each prune test alone with a 240s kill timeout
        working-directory: codex-rs
        run: |
          set +e
          set -u
          bin="$(cat "$RUNNER_TEMP/test-binary")"
          summary="$RUNNER_TEMP/summary.txt"
          : > "$summary"
          mapfile -t tests < <("$bin" --list 2>/dev/null | grep -E '^turn_cost_worker::tests::' | sed 's/: test$//')
          echo "found ${#tests[@]} tests"
          for t in "${tests[@]}"; do
            echo "::group::$t"
            start=$(date +%s)
            timeout -s KILL 240 "$bin" --exact "$t" --nocapture --test-threads=1
            rc=$?
            elapsed=$(( $(date +%s) - start ))
            if [ "$rc" -eq 0 ]; then verdict="ok"; elif [ "$rc" -eq 137 ]; then verdict="HUNG (killed after ${elapsed}s)"; else verdict="FAILED rc=$rc"; fi
            echo "RESULT $t: $verdict (${elapsed}s)" | tee -a "$summary"
            echo "::endgroup::"
          done
          echo "===== SUMMARY ====="
          cat "$summary"
          if grep -qE 'HUNG|FAILED' "$summary"; then exit 1; fi

      - name: Run the exact gate command for the prune suite with a 900s kill timeout
        if: always()
        working-directory: codex-rs
        run: |
          set +e
          CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 CODEX_SKIP_BWRAP_BUILD=1 \
            timeout -s KILL 900 cargo test -p codex-app-server --lib --locked turn_cost_worker -- --nocapture
          rc=$?
          echo "gate-command exit=$rc"
          exit $rc

  remaining-surfaces:
    name: Run the not-yet-verified full-surface commands, nightly surface, and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CODEX_SKIP_BWRAP_BUILD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Linux build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap libcap-dev libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        working-directory: codex-rs
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component rustfmt --no-self-update

      - name: Work graph, memory, and nightly-release surfaces
        run: scripts/verify-elpis --surface agents-work-graph --surface memory --surface nightly-release

      - name: Provider info and chat completions commands
        if: always()
        working-directory: codex-rs
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 cargo test -p codex-model-provider-info --lib --locked
          CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 cargo test -p codex-core --lib --locked chat_completions

      - name: Build release binary and verify identity, clean-home launch, and package
        if: always()
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build -p codex-tui --bin elpis --locked --release
          target/release/elpis --help > /dev/null
          expected="$(sed -n '/^\[package\]/,/^\[[^p]/s/^version *= *"\([^"]*\)"/\1/p' tui/Cargo.toml | head -1)"
          test "$(target/release/elpis --version)" = "elpis $expected"
          smoke_root="$(mktemp -d "$RUNNER_TEMP/elpis-release-smoke.XXXXXX")"
          mkdir -p "$smoke_root/home" "$smoke_root/elpis" "$smoke_root/codex"
          env -i HOME="$smoke_root/home" ELPIS_HOME="$smoke_root/elpis" CODEX_HOME="$smoke_root/codex" PATH="/usr/bin:/bin" \
            target/release/elpis --migrate-from-codex > "$smoke_root/output.txt"
          grep -q 'Preview only. Nothing is selected or copied.' "$smoke_root/output.txt"
          strip target/release/elpis
          if strings target/release/elpis | grep -E "/home/masih|Desktop/p/"; then echo 'Developer-specific path found in release binary.' >&2; exit 1; fi
          cargo install cargo-deb --version 3.7.0 --locked
          cargo deb --no-build -p codex-tui
          ls -la target/debian/
