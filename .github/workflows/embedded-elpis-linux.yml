name: T7 Ledger native verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t7-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
      RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
      INSTA_UPDATE: 'new'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check exact source provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          source = json.loads(pathlib.Path('.github/t7-source.json').read_text())
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:codex-rs'], text=True).strip()
          assert actual == source['native_tree'], (actual, source['native_tree'])
          for p, expected in source['support_sha256'].items():
              assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() == expected, p
          print(json.dumps(source, indent=2))
          PY
      - name: Prepare disposable runner and Rust
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-bin libcap-dev libssl-dev pkg-config tmux lld
          # Only preinstalled SDKs in this fresh hosted runner are discarded.
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [[ -d "$directory" ]]; then sudo gio trash "$directory"; fi
          done
          sudo gio trash --empty
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          df -h .
          free -h
      - name: Verify pinned V8 inputs
        run: |
          set -euo pipefail
          base=https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0
          directory="$RUNNER_TEMP/elpis-v8"
          mkdir -p "$directory"
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          curl --retry 3 -fL "$base/$archive" -o "$directory/$archive"
          curl --retry 3 -fL "$base/$binding" -o "$directory/$binding"
          printf '%s  %s\n' a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583 "$archive" \
            7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506 "$binding" > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum -c SHA256SUMS)
          echo "RUSTY_V8_ARCHIVE=$directory/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$directory/$binding" >> "$GITHUB_ENV"
      - id: cargo_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: t7-ledger-dev-small-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: t7-ledger-dev-small-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Run Ledger behavior and rendering regressions
        id: tests
        continue-on-error: true
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo +1.95.0 test --profile dev-small --locked -p codex-tui --lib ledger_ -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/t7-tests.log"
          cargo +1.95.0 test --profile dev-small --locked -p codex-tui --lib startup_draft::layout::tests -- --list > "$RUNNER_TEMP/t7-startup-tests.list"
          python3 -c 'import os,pathlib; assert "startup_draft::layout::tests::owned_startup_keeps_the_live_bottom_geometry: test" in pathlib.Path(os.environ["RUNNER_TEMP"],"t7-startup-tests.list").read_text()'
          cargo +1.95.0 test --profile dev-small --locked -p codex-tui --lib startup_draft::layout::tests -- --test-threads=2 2>&1 | tee -a "$RUNNER_TEMP/t7-tests.log"
      - name: Collect Rust test output for review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/t7-diagnostics/snapshots" "$RUNNER_TEMP/t7-binary"
          cp .github/t7-source.json "$RUNNER_TEMP/t7-diagnostics/source.json"
          git rev-parse HEAD > "$RUNNER_TEMP/t7-diagnostics/ci-commit.txt"
          for logfile in "$RUNNER_TEMP/t7-tests.log" "$RUNNER_TEMP/t7-build.log"; do
            if [[ -f "$logfile" ]]; then cp "$logfile" "$RUNNER_TEMP/t7-diagnostics/"; fi
          done
          python3 - <<'PY'
          import json, os, pathlib, shutil
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'t7-diagnostics/snapshots'
          pending = []
          for parent, dirs, files in os.walk('codex-rs/tui'):
              for filename in files:
                  if filename.endswith(('.pending-snap', '.snap.new')):
                      source = pathlib.Path(parent)/filename
                      dest = output/source
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, dest)
                      pending.append(str(source))
          (output.parent/'pending-snapshots.json').write_text(json.dumps(pending, indent=2))
          print(f'{len(pending)} files require snapshot review')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t7-ledger-rust-review
          path: ${{ runner.temp }}/t7-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Build the native CLI from the same source
        id: build
        continue-on-error: true
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo +1.95.0 build --profile dev-small --locked -p codex-cli --bin codex 2>&1 | tee "$RUNNER_TEMP/t7-build.log"
      - name: Exercise real terminal controls without model calls
        if: steps.build.outcome == 'success'
        id: native
        continue-on-error: true
        run: |
          node scripts/evals/ledger-close-placement.cjs --binary "$PWD/codex-rs/target/dev-small/codex" --output "$RUNNER_TEMP/t7-proof" --phase candidate
      - name: Render captured ANSI frames
        if: steps.native.outcome == 'success'
        id: render
        continue-on-error: true
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/t7-render" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @xterm/xterm@6.0.0 playwright-core@1.62.1
          node scripts/evals/render-ledger-close-placement.cjs --evidence "$RUNNER_TEMP/t7-proof" --modules "$RUNNER_TEMP/t7-render/node_modules" --chrome /usr/bin/google-chrome
      - name: Collect native build provenance
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/t7-build.log" ]]; then cp "$RUNNER_TEMP/t7-build.log" "$RUNNER_TEMP/t7-diagnostics/"; fi
          if [[ -f codex-rs/target/dev-small/codex ]]; then
            cp codex-rs/target/dev-small/codex "$RUNNER_TEMP/t7-binary/codex"
            sha256sum "$RUNNER_TEMP/t7-binary/codex" > "$RUNNER_TEMP/t7-diagnostics/binary-sha256.txt"
            cp "$RUNNER_TEMP/t7-diagnostics/source.json" "$RUNNER_TEMP/t7-binary/source.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t7-ledger-diagnostics
          path: |
            ${{ runner.temp }}/t7-diagnostics/
            ${{ runner.temp }}/t7-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success'
        with:
          name: t7-native-cli-diagnostic
          path: ${{ runner.temp }}/t7-binary/
          if-no-files-found: error
          retention-days: 7
      - name: Retain compiler cache for a reviewed rerun
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Require all checks and reviewed snapshots
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          RENDER: ${{ steps.render.outcome }}
        run: |
          test "$TESTS" = success
          test "$BUILD" = success
          test "$NATIVE" = success
          test "$RENDER" = success
          python3 - <<'PY'
          import json, os, pathlib
          pending = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'t7-diagnostics/pending-snapshots.json').read_text())
          assert not pending, f'Unreviewed snapshots remain: {pending}'
          PY
