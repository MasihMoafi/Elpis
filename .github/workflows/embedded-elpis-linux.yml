name: Elpis Linux verification

on:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the exhaustive inherited-regression checks
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - .github/workflows/embedded-elpis-linux.yml
      - .github/workflows/launcher-diagnostics.yml
      - codex-rs/**
      - docs/**
      - scripts/install-elpis-binary.sh
      - scripts/install-elpis.sh
      - scripts/verify-elpis
      - tests/verify-elpis/test_verify_elpis.sh
      - tools/verify-elpis/surfaces.toml
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .github/workflows/embedded-elpis-linux.yml
      - .github/workflows/launcher-diagnostics.yml
      - codex-rs/**
      - docs/**
      - scripts/install-elpis-binary.sh
      - scripts/install-elpis.sh
      - scripts/verify-elpis
      - tests/verify-elpis/test_verify_elpis.sh
      - tools/verify-elpis/surfaces.toml
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: elpis-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Elpis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      CODEX_SKIP_BWRAP_BUILD: "1"

    steps:
      - name: Checkout integration head
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-integration'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/product-integration
          fetch-depth: 0

      - name: Checkout source
        if: github.event_name != 'pull_request' || github.head_ref != 'agent/product-integration'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        working-directory: codex-rs
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap \
            libcap-dev \
            libssl-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        working-directory: codex-rs
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component rustfmt --no-self-update

      - name: Materialize reviewed integration source
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-integration' && hashFiles('.github/finalizer/chunk-00') != ''
        working-directory: .
        run: |
          cat .github/finalizer/chunk-* | base64 -d > /tmp/elpis-finalize-ui.py
          python3 /tmp/elpis-finalize-ui.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one {label} in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          remote = "codex-rs/config/src/thread_config/remote.rs"
          replace_once(
              remote,
              "Ok(proto::WireApi::Responses) => WireApi::Responses,\n",
              "Ok(proto::WireApi::Responses) => WireApi::Responses,\n"
              "        Ok(proto::WireApi::AnthropicMessages) => WireApi::AnthropicMessages,\n"
              "        Ok(proto::WireApi::GeminiGenerateContent) => WireApi::GeminiGenerateContent,\n",
              "remote wire API decode arm",
          )
          replace_once(
              remote,
              "WireApi::Responses => proto::WireApi::Responses,\n",
              "WireApi::Responses => proto::WireApi::Responses,\n"
              "        WireApi::AnthropicMessages => proto::WireApi::AnthropicMessages,\n"
              "        WireApi::GeminiGenerateContent => proto::WireApi::GeminiGenerateContent,\n",
              "remote wire API encode arm",
          )
          replace_once(
              remote,
              "    fn proto_sources() -> Vec<proto::ThreadConfigSource> {\n",
              "    #[test]\n"
              "    fn native_wire_apis_roundtrip_through_remote_config() {\n"
              "        for wire_api in [\n"
              "            WireApi::AnthropicMessages,\n"
              "            WireApi::GeminiGenerateContent,\n"
              "        ] {\n"
              "            let mut expected = expected_provider();\n"
              "            expected.wire_api = wire_api;\n"
              "            let proto = model_provider_to_proto(\"native\", expected.clone());\n"
              "            let (id, actual) = model_provider_from_proto(proto)\n"
              "                .expect(\"native model provider from proto\");\n"
              "            assert_eq!(id, \"native\");\n"
              "            assert_eq!(actual, expected);\n"
              "        }\n"
              "    }\n\n"
              "    fn proto_sources() -> Vec<proto::ThreadConfigSource> {\n",
              "remote native wire API regression insertion point",
          )

          proto = "codex-rs/config/src/thread_config/proto/codex.thread_config.v1.proto"
          replace_once(
              proto,
              "  WIRE_API_RESPONSES = 1;\n",
              "  WIRE_API_RESPONSES = 1;\n"
              "  WIRE_API_ANTHROPIC_MESSAGES = 2;\n"
              "  WIRE_API_GEMINI_GENERATE_CONTENT = 3;\n",
              "protobuf wire API value",
          )

          generated = "codex-rs/config/src/thread_config/proto/codex.thread_config.v1.rs"
          replace_once(
              generated,
              "    Responses = 1,\n",
              "    Responses = 1,\n"
              "    AnthropicMessages = 2,\n"
              "    GeminiGenerateContent = 3,\n",
              "generated wire API variant",
          )
          replace_once(
              generated,
              "            Self::Responses => \"WIRE_API_RESPONSES\",\n",
              "            Self::Responses => \"WIRE_API_RESPONSES\",\n"
              "            Self::AnthropicMessages => \"WIRE_API_ANTHROPIC_MESSAGES\",\n"
              "            Self::GeminiGenerateContent => \"WIRE_API_GEMINI_GENERATE_CONTENT\",\n",
              "generated wire API name",
          )
          replace_once(
              generated,
              "            \"WIRE_API_RESPONSES\" => Some(Self::Responses),\n",
              "            \"WIRE_API_RESPONSES\" => Some(Self::Responses),\n"
              "            \"WIRE_API_ANTHROPIC_MESSAGES\" => Some(Self::AnthropicMessages),\n"
              "            \"WIRE_API_GEMINI_GENERATE_CONTENT\" => Some(Self::GeminiGenerateContent),\n",
              "generated wire API parser",
          )
          PY

      - name: Verify selector harness
        run: bash tests/verify-elpis/test_verify_elpis.sh

      - name: Restore Cargo downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: elpis-cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            elpis-cargo-${{ runner.os }}-

      - name: Restore incremental build outputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: codex-rs/target
          key: elpis-target-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            elpis-target-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            elpis-target-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-

      - name: Collect changed paths
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          git diff --name-only -z "$base" "$head" > "$RUNNER_TEMP/elpis-changed-paths"

      - name: Verify changed Linux surfaces
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        run: scripts/verify-elpis --paths-file "$RUNNER_TEMP/elpis-changed-paths"

      - name: Verify conservative full Linux surface
        if: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: scripts/verify-elpis --surface full

      - name: Run exhaustive continuity regression
        if: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_regression) }}
        run: scripts/verify-elpis --surface nightly-release

      - name: Build Elpis binary and Cargo timing report
        working-directory: codex-rs
        run: cargo build -p codex-tui --bin elpis --locked --timings --release

      - name: Verify executable identity
        working-directory: codex-rs
        run: |
          target/release/elpis --help
          # Read the expected version from the manifest instead of pinning a literal:
          # a hardcoded string turns every version bump into a red build.
          expected="$(sed -n '/^\[package\]/,/^\[[^p]/s/^version *= *"\([^"]*\)"/\1/p' tui/Cargo.toml | head -1)"
          test -n "$expected"
          test "$(target/release/elpis --version)" = "elpis $expected"

      - name: Commit verified integration source
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-integration' && hashFiles('.github/finalizer/chunk-00') != ''
        working-directory: .
        run: |
          git config user.name "elpis-integration-agent"
          git config user.email "elpis-integration-agent@users.noreply.github.com"
          git rm .github/workflows/integration-finalize.yml \
            .github/workflows/integration-observer.yml \
            .github/patches/elpis-ui-final.patch
          git rm -r .github/finalizer
          git add codex-rs/config/src/thread_config/remote.rs \
            codex-rs/config/src/thread_config/proto/codex.thread_config.v1.proto \
            codex-rs/config/src/thread_config/proto/codex.thread_config.v1.rs \
            codex-rs/tui/src/branding.rs \
            codex-rs/tui/src/chatwidget/model_popups.rs \
            codex-rs/tui/src/chatwidget/protocol.rs \
            codex-rs/tui/src/chatwidget/status_surfaces.rs
          git diff --cached --check
          git commit -m "fix: finalize integration source"
          git push origin HEAD:agent/product-integration

      - name: Reduce artifact size
        working-directory: codex-rs
        run: strip target/release/elpis

      - name: Upload Elpis binary
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elpis-linux-x86_64
          path: codex-rs/target/release/elpis
          if-no-files-found: error
          retention-days: 7

      - name: Package .deb
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: codex-rs
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build -p codex-tui

      - name: Upload Elpis .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elpis-deb
          path: codex-rs/target/debian/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Cargo timing report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elpis-cargo-timings
          path: codex-rs/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: Build and verify Elpis on macOS (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      MACOS_TARGET: aarch64-apple-darwin

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --no-self-update
          rustup target add "$MACOS_TARGET" --toolchain 1.95.0

      - name: Confirm the runner is Apple Silicon
        run: |
          # macos-14 is arm64. If GitHub ever repoints it, fail loudly rather than
          # publishing an x86_64 binary under an arm64 asset name.
          test "$(uname -s)-$(uname -m)" = "Darwin-arm64"

      - name: Restore Cargo downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: elpis-cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            elpis-cargo-${{ runner.os }}-

      - name: Restore incremental build outputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: codex-rs/target
          key: elpis-target-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            elpis-target-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            elpis-target-${{ runner.os }}-${{ hashFiles('codex-rs/rust-toolchain.toml') }}-

      - name: Verify Elpis launcher and provider entrypoints
        run: cargo test -p codex-tui --bin elpis --locked --target "$MACOS_TARGET"

      - name: Verify context lifecycle and archive failure safety
        run: |
          cargo test -p codex-core --lib --locked --target "$MACOS_TARGET" context_cleaner::tests
          cargo test -p codex-core --lib --locked --target "$MACOS_TARGET" elpis_context::tests

      - name: Verify durable memory admission and filesystem bounds
        run: |
          set -euo pipefail
          # See the Linux job: a filter matching zero tests must fail, not pass silently.
          run_filter() {
            local out
            out=$(cargo test "$@" 2>&1) || { printf '%s\n' "$out"; exit 1; }
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qE 'test result: ok\. 0 passed'; then
              printf '::error::test filter matched zero tests: %s\n' "$*"
              exit 1
            fi
          }
          run_filter -p codex-app-server --test all --locked --target "$MACOS_TARGET" durable_memory_reaches_the_model_only_once_the_ledger_admits_it
          run_filter -p codex-core --lib --locked --target "$MACOS_TARGET" memory_dir_is_readable_without_creating_or_widening_writes
          run_filter -p codex-core --lib --locked --target "$MACOS_TARGET" permission_profile_override_keeps_memories_root_out_of_legacy_projection

      - name: Verify provider protocol and authentication boundaries
        run: |
          cargo test -p codex-model-provider-info --locked --target "$MACOS_TARGET"
          cargo test -p codex-core --lib --locked --target "$MACOS_TARGET" chat_completions

      - name: Verify runtime identity surfaces
        run: |
          cargo test -p codex-tui --lib --locked --target "$MACOS_TARGET" branding::tests
          cargo test -p codex-tui --lib --locked --target "$MACOS_TARGET" slash_command::tests

      - name: Build Elpis binary
        run: cargo build -p codex-tui --bin elpis --locked --release --target "$MACOS_TARGET"

      - name: Ensure the binary carries a valid ad-hoc signature
        run: |
          # The release profile already sets `strip = "symbols"`, so there is nothing
          # left to strip here. What matters on arm64 macOS is the signature: an
          # unsigned or stale-signed Mach-O is killed on launch, and rustc's own strip
          # pass has historically invalidated it. Repair it rather than assume.
          binary="target/$MACOS_TARGET/release/elpis"
          ls -l "$binary"
          if ! codesign --verify --verbose "$binary"; then
            echo "Signature missing or invalid; re-signing ad hoc."
            codesign --force --sign - "$binary"
            codesign --verify --verbose "$binary"
          fi

      - name: Verify the binary is a native arm64 Mach-O
        run: |
          file "target/$MACOS_TARGET/release/elpis"
          file "target/$MACOS_TARGET/release/elpis" | grep -q 'Mach-O 64-bit executable arm64'

      - name: Verify executable identity
        run: |
          binary="target/$MACOS_TARGET/release/elpis"
          "$binary" --help
          expected="$(sed -n '/^\[package\]/,/^\[[^p]/s/^version *= *"\([^"]*\)"/\1/p' tui/Cargo.toml | head -1)"
          test -n "$expected"
          test "$("$binary" --version)" = "elpis $expected"

      - name: Launch the binary headlessly and assert a clean exit
        run: |
          # A non-interactive run that actually starts the async runtime, resolves the
          # Elpis home, and touches the filesystem. This is the dead-on-arrival check:
          # a missing framework or a Linux-only syscall shows up here, not in --version.
          binary="$PWD/target/$MACOS_TARGET/release/elpis"
          home="$RUNNER_TEMP/elpis-smoke-home"
          codex_home="$RUNNER_TEMP/elpis-smoke-codex"
          mkdir -p "$home" "$codex_home"
          ELPIS_HOME="$home" CODEX_HOME="$codex_home" \
            "$binary" --migrate-from-codex > "$RUNNER_TEMP/migrate-preview.txt"
          cat "$RUNNER_TEMP/migrate-preview.txt"
          grep -q 'Preview only. Nothing is selected or copied.' "$RUNNER_TEMP/migrate-preview.txt"
          test -d "$home"

      - name: Upload Elpis macOS binary
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elpis-macos-arm64
          path: codex-rs/target/aarch64-apple-darwin/release/elpis
          if-no-files-found: error
          retention-days: 7

  installer-platform-detection:
    name: Verify installer platform selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run the installer for each platform with a faked uname and curl
        run: |
          set -euo pipefail
          script="$PWD/scripts/install-elpis.sh"
          work="$(mktemp -d "${TMPDIR:-/tmp}/elpis-installer-test.XXXXXX")"
          failures=0

          release="$work/release"
          mkdir -p "$release"
          for asset in elpis-linux-x86_64 elpis-macos-arm64; do
            printf 'payload-for-%s\n' "$asset" > "$release/$asset"
            (cd "$release" && sha256sum "$asset" > "$asset.sha256")
          done

          make_shims() {
            # $1 shim dir, $2 uname -s, $3 uname -m, $4 "gnu" | "bsd"
            local dir=$1 sysname=$2 machine=$3 flavor=$4
            mkdir -p "$dir"
            cat > "$dir/uname" <<EOF
          #!/usr/bin/env bash
          case "\$1" in
            -s) echo "$sysname" ;;
            -m) echo "$machine" ;;
            *) echo "$sysname" ;;
          esac
          EOF
            cat > "$dir/curl" <<EOF
          #!/usr/bin/env bash
          dest=""; url=""
          while [ \$# -gt 0 ]; do
            case "\$1" in
              --output) dest=\$2; shift 2 ;;
              http*) url=\$1; shift ;;
              *) shift ;;
            esac
          done
          echo "CURL \$url" >> "$work/curl.log"
          name=\${url##*/}
          test -f "$release/\$name" || { echo "fake curl: 404 \$name" >&2; exit 22; }
          cp "$release/\$name" "\$dest"
          EOF
            chmod +x "$dir/uname" "$dir/curl"
            # The "bsd" flavor omits sha256sum so the macOS `shasum` fallback runs.
            local tools=(bash sh mktemp mkdir install mv rm cp sed)
            if [ "$flavor" = gnu ]; then
              tools+=(sha256sum shasum)
            else
              tools+=(shasum)
            fi
            for tool in "${tools[@]}"; do
              ln -sf "$(command -v "$tool")" "$dir/$tool"
            done
          }

          check() {
            # $1 label, $2 uname -s, $3 uname -m, $4 flavor, $5 expected asset
            local label=$1 sysname=$2 machine=$3 flavor=$4 expected=$5
            local dir="$work/case-$label"
            make_shims "$dir/bin" "$sysname" "$machine" "$flavor"
            : > "$work/curl.log"
            if env -i HOME="$dir" PATH="$dir/bin" TMPDIR="$dir" \
                ELPIS_SKIP_RTK=1 ELPIS_INSTALL_DIR="$dir/install" \
                bash "$script" > "$dir/out" 2> "$dir/err"; then
              if [ "$(cat "$dir/install/elpis")" != "payload-for-$expected" ]; then
                printf 'FAIL %-14s installed the wrong asset\n' "$label"
                failures=$((failures + 1))
              elif ! grep -q "/$expected\$" "$work/curl.log"; then
                printf 'FAIL %-14s did not fetch %s\n' "$label" "$expected"
                failures=$((failures + 1))
              elif [ ! -x "$dir/install/elpis" ]; then
                printf 'FAIL %-14s installed file is not executable\n' "$label"
                failures=$((failures + 1))
              else
                printf 'PASS %-14s %s-%s -> %s\n' "$label" "$sysname" "$machine" "$expected"
              fi
            else
              printf 'FAIL %-14s installer exited non-zero\n' "$label"
              sed 's/^/       /' "$dir/err"
              failures=$((failures + 1))
            fi
          }

          reject() {
            # $1 label, $2 uname -s, $3 uname -m, $4 flavor
            local label=$1
            local dir="$work/case-$label"
            make_shims "$dir/bin" "$2" "$3" "$4"
            : > "$work/curl.log"
            if env -i HOME="$dir" PATH="$dir/bin" TMPDIR="$dir" \
                ELPIS_SKIP_RTK=1 ELPIS_INSTALL_DIR="$dir/install" \
                bash "$script" > "$dir/out" 2> "$dir/err"; then
              printf 'FAIL %-14s %s-%s was accepted but must be rejected\n' "$label" "$2" "$3"
              failures=$((failures + 1))
            elif [ -s "$work/curl.log" ]; then
              printf 'FAIL %-14s rejected platform still hit the network\n' "$label"
              failures=$((failures + 1))
            else
              printf 'PASS %-14s %s-%s rejected: %s\n' "$label" "$2" "$3" "$(head -1 "$dir/err")"
            fi
          }

          check linux-x86_64 Linux x86_64 gnu elpis-linux-x86_64
          check darwin-arm64 Darwin arm64 bsd elpis-macos-arm64
          reject darwin-x86_64 Darwin x86_64 bsd
          reject linux-aarch64 Linux aarch64 gnu

          test "$failures" -eq 0

  release:
    name: Publish tagged binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos, installer-platform-detection]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download verified Elpis binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: elpis-linux-x86_64
          path: dist

      - name: Download verified Elpis macOS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: elpis-macos-arm64
          path: dist-macos

      - name: Download Elpis .deb
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: elpis-deb
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/elpis dist/elpis-linux-x86_64
          # Both artifacts contain a file named `elpis`, so the macOS one is
          # downloaded to its own directory and renamed before it joins dist/.
          mv dist-macos/elpis dist/elpis-macos-arm64
          (cd dist && sha256sum elpis-linux-x86_64 > elpis-linux-x86_64.sha256)
          (cd dist && sha256sum elpis-macos-arm64 > elpis-macos-arm64.sha256)
          for deb in dist/*.deb; do
            (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
          done
          # Re-tagging the same version must replace the release, not fail on it;
          # this runs only after build+tests pass, so the old release stays live
          # until a verified replacement is seconds away.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            dist/elpis-linux-x86_64 \
            dist/elpis-linux-x86_64.sha256 \
            dist/elpis-macos-arm64 \
            dist/elpis-macos-arm64.sha256 \
            dist/*.deb \
            dist/*.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file .github/RELEASE_NOTES.md \
            --title "Elpis $GITHUB_REF_NAME"
