name: Elpis Linux verification

on:
  workflow_dispatch:
    inputs:
      verification:
        description: 'Compiler checks or full runtime validation'
        required: true
        default: full
        type: choice
        options: [check, full]
  push:
    tags: ['v*']
    branches: [next]
    paths: ['codex-rs/**', 'tools/elpis-claude/**', 'scripts/**', 'tests/install/**', '.github/workflows/embedded-elpis-linux.yml']
  pull_request:
    paths: ['codex-rs/**', 'tools/elpis-claude/**', 'scripts/**', 'tests/install/**', '.github/workflows/embedded-elpis-linux.yml']

permissions:
  contents: read

concurrency:
  group: elpis-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schemas:
    if: github.event_name == 'workflow_dispatch' && inputs.verification == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - id: schema_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: elpis-parity-schema-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: elpis-parity-schema-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Regenerate protocol and configuration schemas from the candidate
        working-directory: codex-rs
        run: |
          export CODEX_APP_SERVER_SCHEMA_ROOT="$PWD/app-server-protocol/schema"
          for experimental in 0 1; do
            CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL=$experimental cargo test --locked -p codex-app-server-protocol --lib schema_fixtures_tests::write_schema_fixtures_from_env -- --exact --ignored
          done
          cargo run --locked -p codex-config-schema -- --out core/config.schema.json
          cargo test --locked -p codex-app-server-protocol --lib schema_fixtures_tests
          tar -czf ../schemas.tar.gz app-server-protocol/schema core/config.schema.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-schemas
          path: schemas.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Retain schema compiler outputs
        if: always() && steps.schema_cache.outputs.cache-hit != 'true' && steps.schema_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.schema_cache.outputs.cache-primary-key }}

  check:
    if: github.event_name == 'workflow_dispatch' && inputs.verification == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
      CARGO_PROFILE_RELEASE_DEBUG: 'none'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config strace iproute2
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Download and verify the pinned sandbox V8
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0
          directory="$RUNNER_TEMP/elpis-v8"
          mkdir -p "$directory"
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          curl -fL "$base/$archive" -o "$directory/$archive"
          curl -fL "$base/$binding" -o "$directory/$binding"
          printf '%s  %s\n' a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583 "$archive" \
            7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506 "$binding" > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum -c SHA256SUMS)
          echo "RUSTY_V8_ARCHIVE=$directory/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$directory/$binding" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: elpis-parity-check-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: elpis-parity-check-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Reuse only unchanged cached Rust sources
        env:
          CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          bash scripts/restore-cargo-cache-source-times.sh "$CACHE_KEY"
      - name: Check core, UI, CLI and their tests
        working-directory: codex-rs
        run: cargo check --locked --tests -p codex-core -p codex-tui -p codex-cli
      - name: Retain compiler outputs
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
      CARGO_PROFILE_RELEASE_DEBUG: 'none'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config strace iproute2
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Read the Elpis version from the CLI manifest
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' codex-rs/cli/Cargo.toml | head -n 1)
          test -n "$version"
          echo "ELPIS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download and verify the pinned sandbox V8
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0
          directory="$RUNNER_TEMP/elpis-v8"
          mkdir -p "$directory"
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          curl -fL "$base/$archive" -o "$directory/$archive"
          curl -fL "$base/$binding" -o "$directory/$binding"
          printf '%s  %s\n' a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583 "$archive" \
            7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506 "$binding" > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum -c SHA256SUMS)
          echo "RUSTY_V8_ARCHIVE=$directory/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$directory/$binding" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: elpis-040-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: elpis-040-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Reuse only unchanged cached Rust sources
        env:
          CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          bash scripts/restore-cargo-cache-source-times.sh "$CACHE_KEY"
      - name: Installer checks
        run: |
          bash tests/install/test_install.sh
          bash tests/install/test_cache_source_times.sh
      - name: Install locked bridge dependencies
        working-directory: tools/elpis-claude
        run: npm ci --ignore-scripts
      - name: Provider history and message retention checks
        run: |
          node scripts/history-list.test.cjs
          node scripts/agy-steering.test.cjs
          node scripts/build-elpis-local.test.cjs
      - name: Build the runtime, Code Mode host, and sandbox
        id: runtime_build
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          cargo build --release --locked -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host
          env -u CODEX_SKIP_BWRAP_BUILD cargo build --release --locked -p codex-bwrap --bin bwrap
          cp target/release/codex target/release/elpis
          test "$(target/release/elpis --version)" = "elpis $ELPIS_VERSION"
      - name: Native UI and retained Elpis interaction tests
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          cargo test --release --locked -p codex-tui --lib -- \
            elpis_ keymap question composer_submission plan_mode review_mode slash_commands \
            goal_validation command_popup agents_overview agents_navigation footer_collapse \
            context_usage context_ledger exec_cell effort_ignition style:: light_terminal_palette \
            chatwidget_exec_and_status_layout_vt100_snapshot luna_reserve_usage_running \
            render_cost_tests esc_typing_tests status_and_layout resume_picker stream_controller \
            custom_prompt_view
      - name: Core permissions and continuity unit tests
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          cargo test --release --locked -p codex-core --lib -- \
            elpis_ smart_prune compact_instructions world_state build_agent_spawn_config \
            live_permissions inherited_permissions step_activation thread_settings turn_input \
            loaded_children_give_up_the_full_access_their_parent_gives_up \
            revocation regains_full_access
      - name: Context and session integration tests
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          cargo test --release --locked -p codex-core --test all -- \
            elpis_ledger_admission elpis_context_attribution work_graphs settings_commits \
            agents_md scenarios_shared_instructions
      - name: Provider configuration and CLI tests
        if: ${{ !cancelled() }}
        working-directory: codex-rs
        run: |
          cargo test --release --locked -p codex-elpis-gateway --lib
          cargo test --release --locked -p codex-model-provider-info --lib
          cargo test --release --locked -p codex-cli --lib
          cargo test --release --locked -p codex-tui --lib branding::tests
      - name: Native permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: node scripts/permissions-runtime.test.cjs "$PWD/codex-rs/target/release/elpis"
      - name: Code Mode permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: node scripts/permissions-runtime.test.cjs "$PWD/codex-rs/target/release/elpis" --code-mode
      - name: Claude bridge permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: node scripts/permissions-bridge.test.cjs "$PWD/codex-rs/target/release/elpis"
      - name: Gemini bridge permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: node scripts/permissions-bridge.test.cjs "$PWD/codex-rs/target/release/elpis" --gemini
      - name: Real runtime evals and failing controls, without outside network
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: sudo --preserve-env=PATH unshare -n sh -c 'ip link set lo up; bash scripts/release-runtime-evals.sh "$PWD/codex-rs/target/release/elpis"'
      - name: Clean offline installation
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: bash tests/install/clean_linux.sh codex-rs/target/release
      - name: Package Linux binaries and Debian installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package/DEBIAN package/usr/bin/codex-resources
          install -m 0755 codex-rs/target/release/elpis dist/elpis-linux-x86_64
          install -m 0755 codex-rs/target/release/codex-code-mode-host dist/elpis-code-mode-host-linux-x86_64
          install -m 0755 codex-rs/target/release/bwrap dist/elpis-bwrap-linux-x86_64
          install -m 0755 dist/elpis-linux-x86_64 package/usr/bin/elpis
          install -m 0755 dist/elpis-code-mode-host-linux-x86_64 package/usr/bin/codex-code-mode-host
          install -m 0755 dist/elpis-bwrap-linux-x86_64 package/usr/bin/codex-resources/bwrap
          cp codex-rs/vendor/bubblewrap/COPYING dist/bubblewrap.COPYING
          cat > package/DEBIAN/control <<CONTROL
          Package: elpis
          Version: $ELPIS_VERSION
          Architecture: amd64
          Maintainer: Elpis <MasihMoafi@users.noreply.github.com>
          Depends: libc6 (>= 2.39), libssl3t64, libgcc-s1, libstdc++6
          Description: Elpis coding agent with context and continuity controls
          CONTROL
          dpkg-deb --root-owner-group --build package "dist/elpis_${ELPIS_VERSION}_amd64.deb"
          for file in dist/elpis-* dist/*.deb; do
            (cd dist && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
      - name: Clean Debian installation
        run: bash tests/install/clean_linux.sh "dist/elpis_${ELPIS_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elpis-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Record diagnostic runtime provenance
        if: failure() && steps.runtime_build.outcome == 'success'
        working-directory: codex-rs/target/release
        run: |
          printf '%s\n' "$GITHUB_SHA" > runtime-source.txt
          sha256sum elpis codex-code-mode-host bwrap > runtime-SHA256SUMS
      - name: Preserve runtime for investigating failed checks
        if: failure() && steps.runtime_build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unverified-diagnostic-runtime
          path: |
            codex-rs/target/release/elpis
            codex-rs/target/release/codex-code-mode-host
            codex-rs/target/release/bwrap
            codex-rs/target/release/runtime-source.txt
            codex-rs/target/release/runtime-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed rendering snapshots for review
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-rendering-differences
          path: codex-rs/**/*.snap.new
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain compiled outputs after checks
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: elpis-linux-x86_64
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' codex-rs/cli/Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" --notes-file .github/RELEASE_NOTES.md \
            --title "Elpis $GITHUB_REF_NAME"
