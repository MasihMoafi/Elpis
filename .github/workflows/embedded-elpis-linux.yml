name: Elpis Linux verification

on:
  workflow_dispatch:
    inputs:
      verification:
        description: 'Compiler, UI-only, full runtime validation, or build-only install package'
        required: true
        default: full
        type: choice
        options: [check, follow-check, ui, full, build]
  push:
    tags: ['v*']
    branches: [next]
    paths: ['codex-rs/**', 'tools/elpis-claude/**', 'scripts/**', 'tests/install/**', '.github/workflows/embedded-elpis-linux.yml']
  pull_request:
    paths: ['codex-rs/**', 'tools/elpis-claude/**', 'scripts/**', 'tests/install/**', '.github/workflows/embedded-elpis-linux.yml']

permissions:
  contents: read

concurrency:
  group: elpis-linux-${{ github.ref }}-${{ inputs.verification || 'full' }}
  # A newer run of the same branch replaces an older one instead of queuing behind it (1 Nov: runs waited 30+ min
  # for superseded ones). Release tags still run to the end.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  schemas:
    if: github.event_name == 'workflow_dispatch' && inputs.verification == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - id: schema_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: elpis-parity-schema-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: elpis-parity-schema-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Regenerate protocol and configuration schemas from the candidate
        working-directory: codex-rs
        run: |
          export CODEX_APP_SERVER_SCHEMA_ROOT="$PWD/app-server-protocol/schema"
          for experimental in 0 1; do
            CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL=$experimental cargo test --locked -p codex-app-server-protocol --lib schema_fixtures_tests::write_schema_fixtures_from_env -- --exact --ignored
          done
          cargo run --locked -p codex-config-schema -- --out core/config.schema.json
          cargo test --locked -p codex-app-server-protocol --lib schema_fixtures_tests
          tar -czf ../schemas.tar.gz app-server-protocol/schema core/config.schema.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-schemas
          path: schemas.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Retain schema compiler outputs
        if: always() && steps.schema_cache.outputs.cache-hit != 'true' && steps.schema_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.schema_cache.outputs.cache-primary-key }}

  check:
    if: github.event_name == 'workflow_dispatch' && (inputs.verification == 'check' || inputs.verification == 'follow-check')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
      CARGO_PROFILE_RELEASE_DEBUG: 'none'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config strace iproute2 tmux
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Download and verify the pinned sandbox V8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/elpis-v8"
          mkdir -p "$directory"
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          gh release download rusty-v8-v150.4.0 -R openai/codex -D "$directory" -p "$archive" -p "$binding"
          printf '%s  %s\n' a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583 "$archive" \
            7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506 "$binding" > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum -c SHA256SUMS)
          echo "RUSTY_V8_ARCHIVE=$directory/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$directory/$binding" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: elpis-parity-check-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: elpis-parity-check-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Reuse only unchanged cached Rust sources
        env:
          CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          bash scripts/restore-cargo-cache-source-times.sh "$CACHE_KEY"
      - name: Check core, UI, CLI and their tests
        if: inputs.verification == 'check'
        working-directory: codex-rs
        run: cargo check --locked --tests -p codex-core -p codex-tui -p codex-cli -p codex-app-server
      - name: Read-only child follow across app-server connections
        if: inputs.verification == 'follow-check'
        working-directory: codex-rs
        run: cargo test --profile dev-small --locked -p codex-core --lib -- disabled_delegate_stays_disabled_when_v2_is_enabled_at_startup
      - name: Retain compiler outputs
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full' || inputs.verification == 'ui' || inputs.verification == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: ${{ inputs.verification == 'build' && '4' || '2' }}
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
      CARGO_PROFILE_RELEASE_DEBUG: 'none'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 50
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          # Build-only runs keep a small release-only cache of their own, so the next one compiles only what changed.
          key: elpis-040-${{ inputs.verification == 'build' && 'build-' || '' }}${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          # A Cargo.lock change (a new crate) must not mean a cold build: fall back to the newest cache of any lock
          # (5 Nov: a cold build took ~100 min against ~20 min warm).
          restore-keys: |
            elpis-040-${{ inputs.verification == 'build' && 'build-' || '' }}${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            elpis-040-${{ inputs.verification == 'build' && 'build-' || '' }}${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config strace iproute2 tmux ripgrep
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          # This disposable runner must permit the namespaces that the sandbox tests create.
          # https://github.com/ubuntu/ubuntu-release-notes/blob/main/docs/24.04/index.md
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Read the Elpis version from the CLI manifest
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' codex-rs/cli/Cargo.toml | head -n 1)
          test -n "$version"
          echo "ELPIS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download and verify the pinned sandbox V8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/elpis-v8"
          mkdir -p "$directory"
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          gh release download rusty-v8-v150.4.0 -R openai/codex -D "$directory" -p "$archive" -p "$binding"
          printf '%s  %s\n' a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583 "$archive" \
            7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506 "$binding" > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum -c SHA256SUMS)
          echo "RUSTY_V8_ARCHIVE=$directory/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$directory/$binding" >> "$GITHUB_ENV"
      - name: Reuse only unchanged cached Rust sources
        env:
          CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          bash scripts/restore-cargo-cache-source-times.sh "$CACHE_KEY"
      - name: Installer checks
        run: |
          bash tests/install/test_install.sh
          bash tests/install/test_cache_source_times.sh
          node --test --test-concurrency=1 tests/install/install-engine.test.mts tests/install/prune-versions.test.mts
      - name: Install locked bridge dependencies
        working-directory: tools/elpis-claude
        run: npm ci --ignore-scripts
      - name: Install locked desktop bridge dependencies
        working-directory: apps/elpis-desktop
        run: npm ci --ignore-scripts
      - name: Provider history and message retention checks
        run: |
          node apps/elpis-desktop/bridge/build-resources.mts --bridge-only
          node --test --test-concurrency=1 scripts/bridge-envelope.test.mts scripts/acp-boundary.test.mts scripts/shared-provider-agy.test.cts
          node --test --test-name-pattern='native nullable instructions|Plan and default mode' tools/elpis-claude/test/turn-delivery.test.mts
          node --test --test-concurrency=1 --test-name-pattern='existing chats are written directly|opening a chat rejoins|opening a completed parent-owned child|a child in a legacy drain' apps/elpis-desktop/bridge/bridge.test.mts
          node --test tools/elpis-claude/test/handover-subscribe.test.mts
          node scripts/store-guard.test.cts
          node scripts/history-list.test.cts
          node --test tools/elpis-claude/test/resume-list.test.mts
          node --test tools/elpis-claude/test/bridge-idle.test.mts
          node --test --test-concurrency=1 tools/elpis-claude/test/approval-review.test.mts tools/elpis-claude/test/delegate-start.test.mts
          node --test --test-concurrency=1 tools/elpis-claude/test/context-agent-worker.test.mts
          node --test --test-name-pattern="a Workflows node's chat starts" tools/elpis-claude/test/elpis-acp-agent.test.mts
          node scripts/bridge-launcher.test.cts
          node scripts/agy-steering.test.cts
          node scripts/build-elpis-local.test.cts
      - name: Build the runtime, Code Mode host, and sandbox
        id: runtime_build
        if: ${{ !cancelled() && inputs.verification != 'ui' }}
        working-directory: codex-rs
        env:
          CARGO_BUILD_JOBS: '4'
        run: |
          cargo build --release --locked -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host
          env -u CODEX_SKIP_BWRAP_BUILD cargo build --release --locked -p codex-bwrap --bin bwrap
          cp target/release/codex target/release/elpis
          mkdir -p target/release/codex-resources
          install -m 0755 target/release/bwrap target/release/codex-resources/bwrap
          # Test harness binaries also need the pinned sandbox on PATH.
          echo "$PWD/target/release/codex-resources" >> "$GITHUB_PATH"
          test "$(target/release/elpis --version)" = "elpis $ELPIS_VERSION"
      - name: Read-only child follow across app-server connections
        if: inputs.verification == 'build'
        working-directory: codex-rs
        run: cargo test --profile dev-small --locked -p codex-app-server --test all -- websocket_read_only_follow_delivers_child_events_across_connections_and_reconnect
      - name: Claude account chat import regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        working-directory: codex-rs
        run: |
          cargo test --profile dev-small --locked -p codex-external-agent-migration --lib detect::sessions::cla::tests
          node ../scripts/claude-import-runtime.test.cts "$PWD/target/release/elpis"
      - name: Record diagnostic runtime provenance
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        working-directory: codex-rs/target/release
        run: |
          printf '%s\n' "$GITHUB_SHA" > runtime-source.txt
          sha256sum elpis codex-code-mode-host bwrap > runtime-SHA256SUMS
      - name: Preserve unverified runtime for parallel terminal checks
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unverified-diagnostic-runtime
          path: |
            codex-rs/target/release/elpis
            codex-rs/target/release/codex-code-mode-host
            codex-rs/target/release/bwrap
            codex-rs/target/release/runtime-source.txt
            codex-rs/target/release/runtime-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: User and project configuration isolation
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        working-directory: codex-rs
        shell: bash
        run: |
          cargo test --profile dev-small --locked -p codex-config --lib -- projectless_directory_tests project_config_ default_off_disables_every_skill_until_one_is_turned_on 2>&1 | tee "$RUNNER_TEMP/elpis-config-checks.log"
          node ../scripts/user-config-isolation.test.cts "$PWD/target/release/elpis" 2>&1 | tee -a "$RUNNER_TEMP/elpis-config-checks.log"
      - name: Preserve configuration failure details immediately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-config-diagnostics
          path: ${{ runner.temp }}/elpis-config-checks.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Native Ledger placement and compact Close regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: |
          node scripts/evals/ledger-close-placement.cts \
            --binary "$PWD/codex-rs/target/release/elpis" \
            --output "$RUNNER_TEMP/elpis-ledger-native" --phase candidate
      - name: Subagent switch follows an open chat
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: node scripts/subagents-switch-runtime.test.cts "$PWD/codex-rs/target/release/elpis"
      - name: Preserve native Ledger evidence
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-ledger-native
          path: |
            ${{ runner.temp }}/elpis-ledger-native
            !${{ runner.temp }}/elpis-ledger-native/trash-data/**
          if-no-files-found: error
          retention-days: 7
      - name: Native permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: node scripts/permissions-runtime.test.cts "$PWD/codex-rs/target/release/elpis"
      - name: Code Mode permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: node scripts/permissions-runtime.test.cts "$PWD/codex-rs/target/release/elpis" --code-mode
      - name: Claude bridge permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: node scripts/permissions-bridge.test.cts "$PWD/codex-rs/target/release/elpis"
      - name: Claude turn delivery and restart recovery through the real native runtime (A124)
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        env:
          A124_ENGINE: ${{ github.workspace }}/codex-rs/target/release/elpis
        run: |
          node apps/elpis-desktop/bridge/build-resources.mts --bridge-only
          node --test --test-reporter=tap tools/elpis-claude/test/claude-turn-record.test.mts tools/elpis-claude/test/turn-delivery.test.mts | tee "$RUNNER_TEMP/elpis-claude-turn-checks.log"
      - name: Preserve Claude restart recovery diagnostics
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-restart-recovery
          path: |
            ${{ runner.temp }}/elpis-claude-*-checks.log
            /tmp/a124-*/stderr.log
            /tmp/a124-*/bridge.log
            /tmp/a124-*/sessions.json
            /tmp/a124-*/engine.jsonl
            /tmp/a124-*/agent.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Gemini bridge permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: node scripts/permissions-bridge.test.cts "$PWD/codex-rs/target/release/elpis" --gemini
      - name: Live admitted context refresh across providers
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: |
          node scripts/bridge-context.test.cts "$PWD/codex-rs/target/release/elpis"
          node scripts/bridge-context.test.cts "$PWD/codex-rs/target/release/elpis" --gemini
      - name: Delegated helper status across server restarts
        if: ${{ !cancelled() && inputs.verification != 'build' }}
        run: node scripts/delegate-status-restart.test.cts
      - name: Exec helper ancestry
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        env:
          ELPIS_PARENT_TEST_BINARY: ${{ github.workspace }}/codex-rs/target/release/elpis
        run: node --test codex-rs/exec/tests/parent-runtime.test.cts
      - name: Delegated helper permission regressions
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: |
          node scripts/delegate-reload.test.cts "$PWD/codex-rs/target/release/elpis"
          node scripts/permissions-bridge-delegation.test.cts "$PWD/codex-rs/target/release/elpis" --keep-going
      - name: Shared launcher, native transport, and provider session ownership
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: |
          # These fixtures own isolated homes and processes; collect every failure in one run.
          failed=0
          node scripts/shared-runtime.test.cts "$PWD/codex-rs/target/release/elpis" || failed=1
          node scripts/terminal-input.test.cts "$PWD/codex-rs/target/release/elpis" --launcher || failed=1
          node scripts/continuity-workflows-terminal.test.cts "$PWD/codex-rs/target/release/elpis" || failed=1
          node scripts/shared-provider-sessions.test.cts "$PWD/codex-rs/target/release/elpis" || failed=1
          node scripts/shared-provider-sessions.test.cts "$PWD/codex-rs/target/release/elpis" --gemini || failed=1
          node scripts/permissions-bridge.test.cts "$PWD/codex-rs/target/release/elpis" --shared || failed=1
          node scripts/permissions-bridge.test.cts "$PWD/codex-rs/target/release/elpis" --shared --gemini || failed=1
          exit "$failed"
      - name: Preserve helper and checkout evidence
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helper-checkout-evidence
          path: |
            /tmp/elpis-wf-*/evidence.json
            /tmp/elpis-wf-*/*.txt
            /tmp/elpis-bridge-delegation-*/evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Real runtime evals and failing controls, without outside network
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: sudo --preserve-env=PATH unshare -n sh -c 'ip link set lo up; bash scripts/release-runtime-evals.sh "$PWD/codex-rs/target/release/elpis"'
      - name: Clean offline installation
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' && inputs.verification != 'build' }}
        run: bash tests/install/clean_linux.sh codex-rs/target/release
      - name: Package Linux binaries and Debian installer
        if: inputs.verification != 'ui'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package/DEBIAN package/usr/bin/codex-resources
          install -m 0755 codex-rs/target/release/elpis dist/elpis-linux-x86_64
          install -m 0755 codex-rs/target/release/codex-code-mode-host dist/elpis-code-mode-host-linux-x86_64
          install -m 0755 codex-rs/target/release/bwrap dist/elpis-bwrap-linux-x86_64
          install -m 0755 dist/elpis-linux-x86_64 package/usr/bin/elpis
          install -m 0755 dist/elpis-code-mode-host-linux-x86_64 package/usr/bin/codex-code-mode-host
          install -m 0755 dist/elpis-bwrap-linux-x86_64 package/usr/bin/codex-resources/bwrap
          cp codex-rs/vendor/bubblewrap/COPYING dist/bubblewrap.COPYING
          cat > package/DEBIAN/control <<CONTROL
          Package: elpis
          Version: $ELPIS_VERSION
          Architecture: amd64
          Maintainer: Elpis <MasihMoafi@users.noreply.github.com>
          Depends: libc6 (>= 2.39), libssl3t64, libgcc-s1, libstdc++6
          Description: Elpis coding agent with context and continuity controls
          CONTROL
          dpkg-deb --root-owner-group --build package "dist/elpis_${ELPIS_VERSION}_amd64.deb"
          for file in dist/elpis-* dist/*.deb; do
            (cd dist && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
      - name: Clean Debian installation
        if: inputs.verification != 'ui' && inputs.verification != 'build'
        run: bash tests/install/clean_linux.sh "dist/elpis_${ELPIS_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.verification != 'ui'
        with:
          name: elpis-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Trim the Rust cache before saving
        # Saved caches must stay well under GitHub's repository limit, or each save evicts the
        # last one and every run recompiles everything (8 Nov: 21 GB per run, 29-minute builds).
        if: always()
        working-directory: codex-rs/target
        run: |
          rm -rf dev-small/incremental release/incremental debug
          rm -rf dev-small/examples
          if [ -d dev-small/deps ]; then find dev-small/deps -maxdepth 1 -type f -executable ! -name '*.so' -delete; fi
          du -sh . || true
      - name: Retain compiled outputs after checks
        # UI-only runs do not rebuild release outputs, so must not label that cache with their source SHA.
        if: always() && inputs.verification != 'ui' && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

  # The Rust test builds (dev-small) need no release binary, so they run beside the build on their own runner
  # (1 Nov: one runner did both in ~111 minutes).
  rust-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full' || inputs.verification == 'ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 50
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          # Build-only runs keep a small release-only cache of their own, so the next one compiles only what changed.
          key: elpis-040-tests-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            elpis-040-tests-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            elpis-040-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            elpis-040-tests-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config strace iproute2 tmux ripgrep
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          # This disposable runner must permit the namespaces that the sandbox tests create.
          # https://github.com/ubuntu/ubuntu-release-notes/blob/main/docs/24.04/index.md
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Read the Elpis version from the CLI manifest
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' codex-rs/cli/Cargo.toml | head -n 1)
          test -n "$version"
          echo "ELPIS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download and verify the pinned sandbox V8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/elpis-v8"
          mkdir -p "$directory"
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          gh release download rusty-v8-v150.4.0 -R openai/codex -D "$directory" -p "$archive" -p "$binding"
          printf '%s  %s\n' a35c75d1f26e6a983885a45b33490a4ebe54f05050568b32b89cfb421b30b583 "$archive" \
            7727826ae479bdb645e807239fb12d1f8e2e23de7a6cf16f5ee592690d1d8506 "$binding" > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum -c SHA256SUMS)
          echo "RUSTY_V8_ARCHIVE=$directory/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$directory/$binding" >> "$GITHUB_ENV"
      - name: Reuse only unchanged cached Rust sources
        env:
          CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          bash scripts/restore-cargo-cache-source-times.sh "$CACHE_KEY"
      - name: Build the pinned sandbox the integration tests run under
        working-directory: codex-rs
        run: |
          # The split-off test job has no release build; without this bwrap the sandbox helper aborts (1 Nov trial run).
          env -u CODEX_SKIP_BWRAP_BUILD cargo build --release --locked -p codex-bwrap --bin bwrap
          mkdir -p target/release/codex-resources
          install -m 0755 target/release/bwrap target/release/codex-resources/bwrap
          echo "$PWD/target/release/codex-resources" >> "$GITHUB_PATH"
      - name: Native UI and retained Elpis interaction tests
        env:
          INSTA_UPDATE: new
          INSTA_FORCE_PASS: '1'
        if: ${{ !cancelled() && inputs.verification != 'build' }}
        working-directory: codex-rs
        shell: bash
        run: |
          # The product's working label appears across the TUI; review every affected render.
          cargo test --profile dev-small --locked -p codex-tui --lib 2>&1 | tee "$RUNNER_TEMP/elpis-ui-checks.log"
          # Collect all renders in each test, while still rejecting unreviewed changes.
          shopt -s globstar nullglob
          snapshots=(tui/**/*.snap.new tui/**/.*.pending-snap)
          if ((${#snapshots[@]})); then
            printf 'Rendering changes require review: %s snapshots\n' "${#snapshots[@]}"
            exit 1
          fi
      - name: Preserve UI failures and rendering snapshots immediately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-rendering-differences
          path: |
            ${{ runner.temp }}/elpis-ui-checks.log
            codex-rs/**/*.snap.new
            codex-rs/**/.*.pending-snap
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Core permissions and continuity unit tests
        if: ${{ !cancelled() && inputs.verification != 'ui' && inputs.verification != 'build' }}
        working-directory: codex-rs
        run: |
          cargo test --profile dev-small --locked -p codex-core --lib -- \
            elpis_ memory_save save_memory smart_prune compact_instructions world_state build_agent_spawn_config \
            refresh_runtime_config_follows_the_subagent_switch_in_the_same_chat \
            subagent_switch_off_overrides_explicit_v2 enabling_subagents_does_not_enable_an_internal_reviewer \
            enabling_subagents_does_not_enable_an_isolated_root \
            disabled_delegate_stays_disabled_when_v2_is_enabled_at_startup \
            reloading_user_file_updates_the_subagent_switch mcp_refresh_does_not_change_the_subagent_switch \
            live_permissions inherited_permissions step_activation thread_settings turn_input \
            loaded_children_give_up_the_full_access_their_parent_gives_up \
            revocation regains_full_access \
            recompute_token_usage record_initial_history_seeds_token_info_from_rollout
          # A chat whose earlier rollout is gone still opens (24 Oct, his rust-obsidian chat).
          cargo test --profile dev-small --locked -p codex-thread-store --lib -- \
            rollout_lineage model_context list_items_reads_what_remains list_items_pages_whole_thread
          # Its history pages say the earliest part is missing (the desktop's note).
          cargo test --profile dev-small --locked -p codex-app-server-protocol --lib -- thread_items_list_round_trips
      - name: Context and session integration tests
        if: ${{ !cancelled() && inputs.verification != 'ui' && inputs.verification != 'build' }}
        working-directory: codex-rs
        shell: bash
        run: |
          cargo test --profile dev-small --locked -p codex-core --test all -- \
            elpis_ledger_admission elpis_context_attribution work_graphs settings_commits \
            agents_md scenarios_shared_instructions \
            deferred_executor_promotes_primary_environment_when_startup_completes \
            deferred_executor_stays_pending_after_materialization \
            deferred_executor_loads_agents_md_when_environment_becomes_ready \
            auto_compact_accounts_for_encrypted_reasoning 2>&1 | tee "$RUNNER_TEMP/elpis-integration-checks.log"
          cargo test --profile dev-small --locked -p codex-app-server --test all -- \
            elpis_instructions_read turn_settings_update thread_read_paginated_carrier_persists_before_first_turn \
            thread_register_copied_codex_rollout_lists_reads_resumes_and_forks_idempotently \
            thread_register_rejects_external_and_malformed_rollouts \
            list_models_refresh \
            2>&1 | tee -a "$RUNNER_TEMP/elpis-integration-checks.log"
      - name: Preserve UI and integration check diagnostics
        if: ${{ !cancelled() && inputs.verification != 'build' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-check-diagnostics
          path: ${{ runner.temp }}/elpis-*-checks.log
          if-no-files-found: error
          retention-days: 7
      - name: Provider configuration and CLI tests
        if: ${{ !cancelled() && inputs.verification != 'ui' && inputs.verification != 'build' }}
        working-directory: codex-rs
        run: |
          cargo test --profile dev-small --locked -p codex-elpis-gateway --lib
          cargo test --profile dev-small --locked -p codex-model-provider-info --lib
          cargo test --profile dev-small --locked -p codex-external-agent-migration --lib claude_home_follows_claude_config_dir
          cargo test --profile dev-small --locked -p codex-cli --lib
      - name: Trim the Rust cache before saving
        # Saved caches must stay well under GitHub's repository limit, or each save evicts the
        # last one and every run recompiles everything (8 Nov: 21 GB per run, 29-minute builds).
        if: always()
        working-directory: codex-rs/target
        run: |
          rm -rf dev-small/incremental release/incremental debug
          rm -rf dev-small/examples
          if [ -d dev-small/deps ]; then find dev-small/deps -maxdepth 1 -type f -executable ! -name '*.so' -delete; fi
          du -sh . || true
      - name: Retain test build outputs
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, rust-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: elpis-linux-x86_64
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' codex-rs/cli/Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" --notes-file .github/RELEASE_NOTES.md \
            --title "Elpis $GITHUB_REF_NAME"
