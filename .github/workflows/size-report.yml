name: Binary size report

on:
  push:
    branches: [size-report]
    paths: ['.github/workflows/size-report.yml']

permissions:
  contents: read

jobs:
  bloat:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          cargo install cargo-bloat --locked
      - name: Size by package
        working-directory: codex-rs
        run: cargo bloat --release --locked -p codex-cli --bin codex --crates -n 80
      - name: Largest functions
        working-directory: codex-rs
        run: cargo bloat --release --locked -p codex-cli --bin codex -n 40
      - name: Size by section
        working-directory: codex-rs
        run: size -A target/release/codex | sort -k2 -nr | head -12
