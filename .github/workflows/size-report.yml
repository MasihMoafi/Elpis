name: Binary size report

# Measures only: builds the TUI + engine with size settings and prints the result. It ships nothing.
# Baseline: the installed binary is 319.6 MB stripped.
on:
  push:
    branches: [size-report]
    paths: ['.github/workflows/size-report.yml']

permissions:
  contents: read

jobs:
  size-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
      CARGO_PROFILE_RELEASE_STRIP: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: size-report-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Build for size
        working-directory: codex-rs
        run: cargo build --release --locked -p codex-cli --bin codex
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: size-report-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
      - name: Report the size
        working-directory: codex-rs/target/release
        run: |
          target/release/codex --version 2>/dev/null || ./codex --version
          ls -l codex
          size -A codex | sort -k2 -nr | head -8
          xz -9e -T0 --stdout codex | wc -c
          zstd -19 -T0 --stdout codex | wc -c
