name: Binary size report

# Measures only: builds the TUI + engine with size settings and prints the result. It ships nothing.
# Results so far: installed 319.6 MB; opt-level=s, panic=abort, thin LTO 148 MB (33 MB under xz).
on:
  push:
    branches: [size-report]
    paths: ['.github/workflows/size-report.yml']

permissions:
  contents: read

jobs:
  size-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: z
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
      CARGO_PROFILE_RELEASE_STRIP: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Build for size
        working-directory: codex-rs
        run: cargo build --release --locked -p codex-cli --bin codex
      - name: Size by package
        working-directory: codex-rs/target/release
        shell: python
        run: |
          import collections, re, subprocess
          out = subprocess.run(['nm', '-S', '-t', 'd', '--demangle=rust', 'codex'],
                               capture_output=True, text=True, check=True).stdout
          totals = collections.Counter()
          for line in out.splitlines():
              parts = line.split(None, 3)
              if len(parts) != 4 or parts[2] not in 'tTwW':
                  continue
              match = re.match(r'[<&\s*]*(?:impl\s+)?(?:dyn\s+)?([A-Za-z_][A-Za-z0-9_]*)::', parts[3])
              totals[match.group(1) if match else '(other)'] += int(parts[1])
          mb = 1024 * 1024
          print(f'code total {sum(totals.values()) / mb:.1f} MB')
          for name, size in totals.most_common(40):
              print(f'{size / mb:8.2f} MB  {name}')
      - name: Report the size
        working-directory: codex-rs/target/release
        run: |
          strip codex
          ./codex --version
          ls -l codex
          size -A codex | sort -k2 -nr | head -8
          xz -9e -T2 --stdout codex | wc -c
          zstd -19 -T0 --stdout codex | wc -c
