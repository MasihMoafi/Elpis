name: Binary size report

# Measures only: compares the smallest build with the published v0.5.1 binary. It ships nothing.
# Sizes so far: installed 319.6 MiB; opt-level=s 141 MiB; opt-level=z with fat LTO 90 MiB (26 MiB under xz).
on:
  push:
    branches: [size-report]
    paths: ['.github/workflows/size-report.yml']

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CODEX_SKIP_BWRAP_BUILD: '1'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: z
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
      CARGO_PROFILE_RELEASE_STRIP: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Build for size
        working-directory: codex-rs
        run: cargo build --release --locked -p codex-cli --bin codex
      - name: Fetch the published binary
        run: |
          mkdir bench
          curl --fail --location --silent --show-error --output bench/normal \
            https://github.com/MasihMoafi/Elpis/releases/download/v0.5.1/elpis-linux-x86_64
          chmod +x bench/normal
          install -m 0755 codex-rs/target/release/codex bench/small
          ls -l bench
      - name: Compare speed
        working-directory: bench
        shell: python
        run: |
          import os, pathlib, shutil, statistics, subprocess, tempfile, time

          home = tempfile.mkdtemp()
          env = {**os.environ, 'HOME': home, 'CODEX_HOME': home, 'ELPIS_HOME': home}
          lines = [f'line {i} of the benchmark file' for i in range(3000)]
          original = '\n'.join(lines) + '\n'
          body = ''.join(f'-{line}\n+{line} changed\n' for line in lines)
          patch = f'*** Begin Patch\n*** Update File: target.txt\n@@\n{body}*** End Patch'
          work = tempfile.mkdtemp()

          def run(binary, *args):
              start = time.perf_counter()
              done = subprocess.run([binary, *args], env=env, cwd=work, capture_output=True, timeout=120)
              elapsed = time.perf_counter() - start
              if done.returncode:
                  raise SystemExit(f'{args[:1]} failed: {done.stderr[-400:]!r}')
              return elapsed

          def version(binary):
              return run(binary, '--version')

          def features(binary):
              return run(binary, 'features', 'list')

          def apply_patch(binary):
              pathlib.Path(work, 'target.txt').write_text(original)
              return run(binary, '--codex-run-as-apply-patch', patch)

          def app_server(binary):
              request = b'{"id":1,"method":"initialize","params":{"clientInfo":{"name":"bench","title":"b","version":"1"}}}\n'
              start = time.perf_counter()
              process = subprocess.Popen([binary, 'app-server'], env=env, cwd=work, stdin=subprocess.PIPE,
                                         stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              process.stdin.write(request)
              process.stdin.flush()
              reply = process.stdout.readline()
              elapsed = time.perf_counter() - start
              process.kill()
              process.wait()
              if not reply:
                  raise SystemExit('app-server gave no reply')
              return elapsed

          binaries = {'normal': os.path.abspath('normal'), 'small': os.path.abspath('small')}
          for name, measure, rounds in [('version', version, 40), ('features list', features, 20),
                                        ('apply 3000-line patch', apply_patch, 20),
                                        ('engine start to first reply', app_server, 15)]:
              results = {key: [] for key in binaries}
              for _ in range(rounds):
                  for key, binary in binaries.items():
                      results[key].append(measure(binary) * 1000)
              normal = statistics.median(results['normal'])
              small = statistics.median(results['small'])
              print(f'RESULT {name}: normal {normal:.1f} ms, small {small:.1f} ms, ratio {small / normal:.2f}')
