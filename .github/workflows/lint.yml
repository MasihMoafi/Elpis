name: Lint
# Fast checks on every push and pull request, so a broken workflow, script, format or a known-vulnerable crate fails
# in a minute or two instead of after the 45-minute engine build.
on:
  push:
  pull_request:
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        env:
          SHELLCHECK_OPTS: -S warning
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
  scripts:
    name: scripts and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell scripts (shellcheck, errors)
        run: shellcheck -S error scripts/*.sh apps/elpis-desktop/scripts/*.sh
      - name: Node scripts parse
        run: for f in scripts/*.mjs apps/elpis-desktop/scripts/*.mjs apps/elpis-desktop/scripts/*.cjs; do if [ -f "$f" ]; then node --check "$f"; fi; done
      - name: JavaScript migration guard
        run: node scripts/js-guard.mjs && node --test scripts/js-guard.test.mjs
      - name: Website and README page
        run: node --test website/tests/site.test.mjs
  strict:
    name: desktop strict checks (types, oxlint, jscpd)
    # The ratchet in apps/elpis-desktop/strict-baseline.json: counts may only go down and new files must be clean
    # (scripts/strict-baseline.mts; docs/specs/typescript-migration.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the bridge resources the bridge imports
        run: node bridge/build-resources.mts
      - name: Renderer typecheck (clean)
        run: npm run -s typecheck -- --incremental false
      - name: Strict type checks, lint and duplication against the baseline
        run: node scripts/strict-baseline.mts
      - name: Ratchet tests
        run: node --test tests/strict-baseline.test.mjs
  rust-format:
    name: rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt --check
        working-directory: codex-rs
        run: cargo fmt --check
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        working-directory: codex-rs
        # codex-rs/.cargo/audit.toml lists the accepted advisories, each with its reason.
        run: cargo audit
