name: Elpis desktop

# Builds the desktop renderer and runs the full test set (every UI shard and the fast, bridge and desktop tiers) on
# main, integrate/**, build/** and every pull request (6 Nov, Masih approved running it beyond build/**). Since 22
# October the GUI app also builds locally (docs/LOCAL_BUILD_RULES.md); the build/** artifact is the alternative that
# scripts/install-desktop.mts --actions installs, the artifact of exactly that commit.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main', 'integrate/**', 'build/**']

permissions:
  contents: read

concurrency:
  group: elpis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: apps/elpis-desktop/.next/cache
          key: next-${{ hashFiles('apps/elpis-desktop/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('apps/elpis-desktop/package-lock.json') }}-
      - name: Build the renderer
        run: |
          node bridge/build-resources.mts
          npm run -s build
          printf '%s\n' "$GITHUB_SHA" > out/.commit
      - name: Prepare the retained UI checkpoint
        run: |
          bash scripts/fetch-retained.sh
      - name: Bind the renderer and complete regression plan to eight shards (six took 9.5 min on the slowest, 7 Nov)
        id: plan
        run: |
          node scripts/renderer-artifact-gate.mts --prepare "$RUNNER_TEMP/elpis-ui-plan" 8
          node --input-type=module -e '
            import fs from "node:fs";
            const { shardCount } = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            console.log(`shards=${JSON.stringify(Array.from({ length: shardCount }, (_, index) => index))}`);
          ' "$RUNNER_TEMP/elpis-ui-plan/plan.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-ui-plan
          path: ${{ runner.temp }}/elpis-ui-plan
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the exact renderer for the shards and for diagnosis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-unverified
          path: apps/elpis-desktop/out
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  renderer-ui:
    needs: renderer-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.renderer-build.outputs.shards) }}
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies and test resources
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node bridge/build-resources.mts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-unverified
          path: apps/elpis-desktop/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-ui-plan
          path: ${{ runner.temp }}/elpis-ui-plan
      - name: Prepare the retained UI checkpoint and browser prerequisite
        run: |
          bash scripts/fetch-retained.sh
          npm install --prefix "$RUNNER_TEMP/elpis-ui" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          test -x /usr/bin/google-chrome
          # The browser-tab test types and clicks as the person, through X input.
          sudo apt-get install -y --no-install-recommends xdotool || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xdotool; }
      - name: Verify the exact renderer against retained and current UI regressions
        env:
          ELPIS_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/elpis-ui/node_modules/playwright-core
          ELPIS_CHROMIUM: /usr/bin/google-chrome
          ELPIS_REVIEW_SHOTS: ${{ runner.temp }}/elpis-ui-evidence/review
        run: node scripts/renderer-artifact-gate.mts --shard "$RUNNER_TEMP/elpis-ui-plan/plan.json" "${{ matrix.shard }}" "$RUNNER_TEMP/elpis-ui-evidence"
      - name: Preserve UI gate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-ui-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/elpis-ui-evidence
          if-no-files-found: warn
          retention-days: 14

  renderer:
    needs: [renderer-build, renderer-ui]
    # Merge failed shards too, so every recorded failure and missing shard is reported.
    if: ${{ !cancelled() && needs.renderer-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      # The evidence gate discovers tests with the TypeScript parser.
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-unverified
          path: apps/elpis-desktop/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-ui-plan
          path: ${{ runner.temp }}/elpis-ui-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: renderer-ui-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/elpis-ui-evidence
      - name: Prepare the retained UI checkpoint
        run: |
          bash scripts/fetch-retained.sh
      - name: Merge every shard and write the installer receipt
        run: node scripts/renderer-artifact-gate.mts --merge "$RUNNER_TEMP/elpis-ui-plan/plan.json" "$RUNNER_TEMP/elpis-ui-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer
          path: apps/elpis-desktop/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # The non-UI tiers run here (they include the artifact gate and inventory tests, so the build job does not repeat them);
  # the shards above run every UI test against the exact built renderer (A46b, 20 October). No browser is needed here.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tiers: ['fast bridge desktop']
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the ACP test agent dependencies
        run: npm ci --prefix ../../tools/elpis-claude --ignore-scripts --no-audit --no-fund
      - name: Install the Electron test binary
        run: npm rebuild electron --no-audit --no-fund
      - name: Install PDF text and audio tools the attachment and transcription tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - name: Run the gate (${{ matrix.tiers }})
        run: node scripts/test-gate.mts ${{ matrix.tiers }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-${{ strategy.job-index }}
          path: /tmp/elpis-test-gate-*
          if-no-files-found: ignore
          retention-days: 14
