name: Elpis desktop

# Builds the desktop renderer for every build/* branch, so no build runs on Masih's machine (20 October: "use github
# actions for all builds"). scripts/install-desktop.mjs --actions installs the artifact of exactly that commit.
on:
  workflow_dispatch:
  push:
    branches: ['build/**']

permissions:
  contents: read

concurrency:
  group: elpis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: apps/elpis-desktop/.next/cache
          key: next-${{ hashFiles('apps/elpis-desktop/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('apps/elpis-desktop/package-lock.json') }}-
      - name: Build the renderer
        run: |
          node bridge/build-resources.mjs
          npm run -s build
          printf '%s\n' "$GITHUB_SHA" > out/.commit
      - name: Verify the artifact gate and inventory guards
        run: node --test --test-reporter=tap tests/renderer-artifact-gate.test.mjs tests/test-inventory.test.mjs
      - name: Prepare the retained UI checkpoint
        run: |
          baseline=$(node --input-type=module -e 'import { baselineCommit } from "./scripts/renderer-artifact-gate.mjs"; console.log(baselineCommit)')
          git cat-file -e "$baseline^{commit}" || git fetch --no-tags --depth=1 origin "$baseline"
      - name: Bind the renderer and complete regression plan to six shards
        id: plan
        run: |
          node scripts/renderer-artifact-gate.mjs --prepare "$RUNNER_TEMP/elpis-ui-plan" 6
          node --input-type=module -e '
            import fs from "node:fs";
            const { shardCount } = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            console.log(`shards=${JSON.stringify(Array.from({ length: shardCount }, (_, index) => index))}`);
          ' "$RUNNER_TEMP/elpis-ui-plan/plan.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-ui-plan
          path: ${{ runner.temp }}/elpis-ui-plan
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the exact renderer for the shards and for diagnosis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-unverified
          path: apps/elpis-desktop/out
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  renderer-ui:
    needs: renderer-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.renderer-build.outputs.shards) }}
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies and test resources
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node bridge/build-resources.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-unverified
          path: apps/elpis-desktop/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-ui-plan
          path: ${{ runner.temp }}/elpis-ui-plan
      - name: Prepare the retained UI checkpoint and browser prerequisite
        run: |
          baseline=$(node --input-type=module -e 'import { baselineCommit } from "./scripts/renderer-artifact-gate.mjs"; console.log(baselineCommit)')
          git cat-file -e "$baseline^{commit}" || git fetch --no-tags --depth=1 origin "$baseline"
          npm install --prefix "$RUNNER_TEMP/elpis-ui" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          test -x /usr/bin/google-chrome
      - name: Verify the exact renderer against retained and current UI regressions
        env:
          ELPIS_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/elpis-ui/node_modules/playwright-core
          ELPIS_CHROMIUM: /usr/bin/google-chrome
          ELPIS_REVIEW_SHOTS: ${{ runner.temp }}/elpis-ui-evidence/review
        run: node scripts/renderer-artifact-gate.mjs --shard "$RUNNER_TEMP/elpis-ui-plan/plan.json" "${{ matrix.shard }}" "$RUNNER_TEMP/elpis-ui-evidence"
      - name: Preserve UI gate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-ui-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/elpis-ui-evidence
          if-no-files-found: warn
          retention-days: 14

  renderer:
    needs: [renderer-build, renderer-ui]
    # Merge failed shards too, so every recorded failure and missing shard is reported.
    if: ${{ !cancelled() && needs.renderer-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-unverified
          path: apps/elpis-desktop/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: renderer-ui-plan
          path: ${{ runner.temp }}/elpis-ui-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: renderer-ui-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/elpis-ui-evidence
      - name: Prepare the retained UI checkpoint
        run: |
          baseline=$(node --input-type=module -e 'import { baselineCommit } from "./scripts/renderer-artifact-gate.mjs"; console.log(baselineCommit)')
          git cat-file -e "$baseline^{commit}" || git fetch --no-tags --depth=1 origin "$baseline"
      - name: Merge every shard and write the installer receipt
        run: node scripts/renderer-artifact-gate.mjs --merge "$RUNNER_TEMP/elpis-ui-plan/plan.json" "$RUNNER_TEMP/elpis-ui-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer
          path: apps/elpis-desktop/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # The non-UI tiers run here; the shards above run every UI test against the exact built renderer (A46b, 20 October).
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tiers: ['fast bridge desktop']
    defaults:
      run:
        working-directory: apps/elpis-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: apps/elpis-desktop/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the ACP test agent dependencies
        run: npm ci --prefix ../../tools/elpis-claude --ignore-scripts --no-audit --no-fund
      - name: Install the Electron test binary
        run: npm rebuild electron --no-audit --no-fund
      - name: Install Playwright and its Chromium (the version the local tests use)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "ELPIS_PLAYWRIGHT_PACKAGE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Install PDF text and audio tools the attachment and transcription tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - name: Run the gate (${{ matrix.tiers }})
        run: node scripts/test-gate.mjs ${{ matrix.tiers }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-${{ strategy.job-index }}
          path: /tmp/elpis-test-gate-*
          if-no-files-found: ignore
          retention-days: 14
