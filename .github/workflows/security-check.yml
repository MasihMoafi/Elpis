name: Security Check
# The one place cargo audit runs: on every push and pull request, and weekly on a tree that did not change.

on:
  push:
  pull_request:
  schedule:
    # Advisories land after a build passes, so re-check on a fixed tree weekly.
    - cron: "0 6 * * 1"

concurrency:
  group: security-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        working-directory: codex-rs
        # codex-rs/.cargo/audit.toml lists the accepted advisories, each with its reason.
        run: cargo audit
