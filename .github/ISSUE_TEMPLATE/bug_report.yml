name: Report a bug
description: Help make Elpis reliable with a small reproducible example.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Elpis version
      description: Run elpis --version. For the desktop app, add the version and commit from Settings > About.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - Terminal app (elpis)
        - Desktop app
        - Both
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Linux distribution and version, X11 or Wayland, and how Elpis was installed (installer, Debian package, source).
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: ChatGPT sign-in, Claude, Gemini, OpenRouter, an API key or a local model, and the model name. Never paste keys or tokens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a fresh start. Use a small synthetic project; keep private code and conversations out of reports.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you saw
      description: The exact error text, or what happened instead. For a desktop error notice, include its code and request ID.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or terminal output
      description: |
        Optional. Only the lines around the failure. $ELPIS_HOME defaults to ~/.elpis-next.
        Terminal app: $ELPIS_HOME/logs_2.sqlite (an SQLite database; logs_client from codex-rs/cli reads it).
        Desktop app: $ELPIS_HOME/logs/desktop-requests.jsonl, and the output of the terminal that started it.
        Claude and Gemini turns: /tmp/acp-bridge/bridge.log, when that folder exists.
        Remove personal information and credentials before sharing.
