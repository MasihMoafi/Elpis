site_name: Elpis
site_description: Portable context, memory, and continuity for terminal coding agents.
site_url: https://masihmoafi.github.io/Elpis/
repo_url: https://github.com/MasihMoafi/Elpis
repo_name: MasihMoafi/Elpis
theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
    - content.action.edit
nav:
  - Home: index.md
  - Using Elpis:
      - Context and pruning: context.md
      - Sessions and continuity: sessions.md
      - Memory: memory.md
      - Providers: providers.md
      - Workspace RAG: rag.md
      - Visual walkthrough: visual-walkthrough.md
  - Reference:
      - Context and sessions in depth: CONTEXT_AND_SESSIONS.md
      - Build and reduction audit: BUILD_AND_REDUCTION_AUDIT.md
      - Shipping rules: SHIPPING_RULES.md
      - Local build rules: LOCAL_BUILD_RULES.md
  - Release history:
      - v0.1 archive: TASKS_V0_1_ARCHIVE.md
  - Blog:
      - The one-line sabotage: blog/the-one-line-sabotage.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
