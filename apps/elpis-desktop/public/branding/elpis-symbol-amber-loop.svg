<svg xmlns="http://www.w3.org/2000/svg" class="elpis-motion" viewBox="0 0 256 256" role="img" aria-labelledby="elpis-symbol-animated-title elpis-symbol-animated-desc"><title id="elpis-symbol-animated-title">Elpis amber animated symbol</title><desc id="elpis-symbol-animated-desc">Elpis continuity identity. The mark remains visible while a light sweep repeats every six seconds. Reduced motion is static.</desc><defs><linearGradient id="elpis-symbol-animated-motion-ember" gradientUnits="userSpaceOnUse" x1="54" y1="20" x2="212" y2="236"><stop offset="0" stop-color="#D97913" /><stop offset="0.34" stop-color="#F2A626" /><stop offset="0.65" stop-color="#FFD45A" /><stop offset="1" stop-color="#FFE786" /></linearGradient><linearGradient id="elpis-symbol-animated-motion-light"><stop stop-color="white" stop-opacity="0" /><stop offset=".5" stop-color="white" stop-opacity=".4" /><stop offset="1" stop-color="white" stop-opacity="0" /></linearGradient><clipPath id="elpis-symbol-animated-motion-clip"><path d="M108 20H228C225 45 206 62 178 62H103C67 62 38 78 29 104C26 78 32 62 47 46C63 29 85 20 108 20Z" /><path d="M72 82C52 91 36 104 35 114C34 126 51 140 75 150C90 157 105 160 124 160H155C181 160 200 142 204 115H133C94 115 70 105 72 82Z" /><path d="M42 137C53 148 65 156 79 162C69 172 70 184 81 192C91 200 110 202 133 202H180C205 202 225 216 228 236H108C86 236 67 229 52 216C36 202 28 184 28 168C28 157 33 146 42 137Z" /></clipPath></defs><style>
.elpis-motion .elpis-ribbon{transform-box:fill-box;transform-origin:center;animation:elpis-symbol-animated-arrive .85s cubic-bezier(.16,1,.3,1) both}
.elpis-motion .band-1{animation-delay:.13s}.elpis-motion .band-2{animation-delay:.26s}
.elpis-motion .elpis-light{opacity:0;animation:elpis-symbol-animated-sweep 6s 1.05s ease-in-out infinite}
@keyframes elpis-symbol-animated-arrive{from{opacity:0;transform:translate(-13px,4px)}to{opacity:1;transform:translate(0,0)}}
@keyframes elpis-symbol-animated-sweep{0%{opacity:0;transform:translateX(-280px)}4%,18%{opacity:1}28%,100%{opacity:0;transform:translateX(280px)}}
@media(prefers-reduced-motion:reduce){.elpis-motion .elpis-ribbon,.elpis-motion .elpis-light{animation:none}.elpis-motion .elpis-ribbon{opacity:1;transform:none}.elpis-motion .elpis-light{opacity:0}}
</style><path class="elpis-ribbon band-0" d="M108 20H228C225 45 206 62 178 62H103C67 62 38 78 29 104C26 78 32 62 47 46C63 29 85 20 108 20Z" fill="url(#elpis-symbol-animated-motion-ember)" /><path class="elpis-ribbon band-1" d="M72 82C52 91 36 104 35 114C34 126 51 140 75 150C90 157 105 160 124 160H155C181 160 200 142 204 115H133C94 115 70 105 72 82Z" fill="url(#elpis-symbol-animated-motion-ember)" /><path class="elpis-ribbon band-2" d="M42 137C53 148 65 156 79 162C69 172 70 184 81 192C91 200 110 202 133 202H180C205 202 225 216 228 236H108C86 236 67 229 52 216C36 202 28 184 28 168C28 157 33 146 42 137Z" fill="url(#elpis-symbol-animated-motion-ember)" /><g clip-path="url(#elpis-symbol-animated-motion-clip)"><rect class="elpis-light" x="0" y="0" width="100" height="256" fill="url(#elpis-symbol-animated-motion-light)" /></g></svg>
