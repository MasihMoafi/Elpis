<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="490" viewBox="0 0 1140 490" style="background-color: #0d1117; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<rect x="0" y="0" width="1140" height="490" fill="#0d1117" rx="12" />
  <style>
    .gridline { stroke: #334155; stroke-dasharray: 4 4; }
    .tick-text { fill: #94a3b8; font-size: 13px; font-weight: 600; }
    .blab { fill: #f8fafc; font-size: 15px; font-weight: 700; }
    .bval { fill: #ffffff; font-size: 15px; font-weight: 800; }
    .rlabel { fill: #cbd5e1; font-size: 14px; font-weight: 700; }
  </style>

  <!-- Header -->
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="700">Input Tokens per Model Call (Interquartile Range &amp; Median across 3 Runs)</text>
  <text x="40" y="68" fill="#94a3b8" font-size="14">Box = 25th–75th percentile (IQR), bold line = median, whiskers = full range across completed requests on gpt-5.6-luna</text>

  <!-- Run 1 -->
  <text x="40" y="102" class="rlabel">Run 1 (42 Ace passes)</text>
  <g transform="translate(10, 95)">
    <line x1="160.0" y1="10" x2="160.0" y2="82.0" class="gridline"/>
    <text x="160.0" y="100.0" class="tick-text" text-anchor="middle">0</text>
    <line x1="310.0" y1="10" x2="310.0" y2="82.0" class="gridline"/>
    <text x="310.0" y="100.0" class="tick-text" text-anchor="middle">48.1k</text>
    <line x1="460.0" y1="10" x2="460.0" y2="82.0" class="gridline"/>
    <text x="460.0" y="100.0" class="tick-text" text-anchor="middle">96.2k</text>
    <line x1="610.0" y1="10" x2="610.0" y2="82.0" class="gridline"/>
    <text x="610.0" y="100.0" class="tick-text" text-anchor="middle">144.3k</text>
    <line x1="760.0" y1="10" x2="760.0" y2="82.0" class="gridline"/>
    <text x="760.0" y="100.0" class="tick-text" text-anchor="middle">192.4k</text>
    <line x1="910.0" y1="10" x2="910.0" y2="82.0" class="gridline"/>
    <text x="910.0" y="100.0" class="tick-text" text-anchor="middle">240.6k</text>
    
    <!-- Codex -->
    <line x1="228.8" y1="28.0" x2="917.5" y2="28.0" stroke="#38bdf8" stroke-width="2.0"/>
    <rect x="361.5" y="17.0" width="322.3" height="22.0" rx="4" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="531.2" y1="17.0" x2="531.2" y2="39.0" stroke="#ffffff" stroke-width="3.0"/>
    <text x="145" y="34.0" class="blab" text-anchor="end">Codex</text>
    <text x="935" y="34.0" class="bval" fill="#38bdf8">119.2k</text>
    
    <!-- Elpis -->
    <line x1="216.4" y1="64.0" x2="421.3" y2="64.0" stroke="#34d399" stroke-width="2.0"/>
    <rect x="360.2" y="53.0" width="28.8" height="22.0" rx="4" fill="#34d399" fill-opacity="0.45" stroke="#34d399" stroke-width="1.8"/>
    <line x1="377.0" y1="53.0" x2="377.0" y2="75.0" stroke="#ffffff" stroke-width="3.0"/>
    <text x="145" y="70.0" class="blab" text-anchor="end">Elpis</text>
    <text x="935" y="70.0" class="bval" fill="#34d399">69.6k</text>
  </g>

  <!-- Run 2 -->
  <text x="40" y="217" class="rlabel">Run 2 (13 Ace passes)</text>
  <g transform="translate(10, 210)">
    <line x1="160.0" y1="10" x2="160.0" y2="82.0" class="gridline"/>
    <text x="160.0" y="100.0" class="tick-text" text-anchor="middle">0</text>
    <line x1="310.0" y1="10" x2="310.0" y2="82.0" class="gridline"/>
    <text x="310.0" y="100.0" class="tick-text" text-anchor="middle">48.1k</text>
    <line x1="460.0" y1="10" x2="460.0" y2="82.0" class="gridline"/>
    <text x="460.0" y="100.0" class="tick-text" text-anchor="middle">96.2k</text>
    <line x1="610.0" y1="10" x2="610.0" y2="82.0" class="gridline"/>
    <text x="610.0" y="100.0" class="tick-text" text-anchor="middle">144.3k</text>
    <line x1="760.0" y1="10" x2="760.0" y2="82.0" class="gridline"/>
    <text x="760.0" y="100.0" class="tick-text" text-anchor="middle">192.4k</text>
    <line x1="910.0" y1="10" x2="910.0" y2="82.0" class="gridline"/>
    <text x="910.0" y="100.0" class="tick-text" text-anchor="middle">240.6k</text>
    
    <!-- Codex -->
    <line x1="228.8" y1="28.0" x2="914.5" y2="28.0" stroke="#38bdf8" stroke-width="2.0"/>
    <rect x="404.2" y="17.0" width="374.0" height="22.0" rx="4" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="608.4" y1="17.0" x2="608.4" y2="39.0" stroke="#ffffff" stroke-width="3.0"/>
    <text x="145" y="34.0" class="blab" text-anchor="end">Codex</text>
    <text x="935" y="34.0" class="bval" fill="#38bdf8">143.9k</text>
    
    <!-- Elpis -->
    <line x1="216.4" y1="64.0" x2="558.2" y2="64.0" stroke="#34d399" stroke-width="2.0"/>
    <rect x="334.8" y="53.0" width="89.5" height="22.0" rx="4" fill="#34d399" fill-opacity="0.45" stroke="#34d399" stroke-width="1.8"/>
    <line x1="376.9" y1="53.0" x2="376.9" y2="75.0" stroke="#ffffff" stroke-width="3.0"/>
    <text x="145" y="70.0" class="blab" text-anchor="end">Elpis</text>
    <text x="935" y="70.0" class="bval" fill="#34d399">69.6k</text>
  </g>

  <!-- Run 3 -->
  <text x="40" y="332" class="rlabel">Run 3 (10 Ace passes)</text>
  <g transform="translate(10, 325)">
    <line x1="160.0" y1="10" x2="160.0" y2="82.0" class="gridline"/>
    <text x="160.0" y="100.0" class="tick-text" text-anchor="middle">0</text>
    <line x1="310.0" y1="10" x2="310.0" y2="82.0" class="gridline"/>
    <text x="310.0" y="100.0" class="tick-text" text-anchor="middle">48.1k</text>
    <line x1="460.0" y1="10" x2="460.0" y2="82.0" class="gridline"/>
    <text x="460.0" y="100.0" class="tick-text" text-anchor="middle">96.2k</text>
    <line x1="610.0" y1="10" x2="610.0" y2="82.0" class="gridline"/>
    <text x="610.0" y="100.0" class="tick-text" text-anchor="middle">144.3k</text>
    <line x1="760.0" y1="10" x2="760.0" y2="82.0" class="gridline"/>
    <text x="760.0" y="100.0" class="tick-text" text-anchor="middle">192.4k</text>
    <line x1="910.0" y1="10" x2="910.0" y2="82.0" class="gridline"/>
    <text x="910.0" y="100.0" class="tick-text" text-anchor="middle">240.6k</text>
    
    <!-- Codex -->
    <line x1="228.8" y1="28.0" x2="902.2" y2="28.0" stroke="#38bdf8" stroke-width="2.0"/>
    <rect x="359.8" y="17.0" width="372.4" height="22.0" rx="4" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="553.3" y1="17.0" x2="553.3" y2="39.0" stroke="#ffffff" stroke-width="3.0"/>
    <text x="145" y="34.0" class="blab" text-anchor="end">Codex</text>
    <text x="935" y="34.0" class="bval" fill="#38bdf8">126.3k</text>
    
    <!-- Elpis -->
    <line x1="216.4" y1="64.0" x2="545.9" y2="64.0" stroke="#34d399" stroke-width="2.0"/>
    <rect x="323.4" y="53.0" width="115.1" height="22.0" rx="4" fill="#34d399" fill-opacity="0.45" stroke="#34d399" stroke-width="1.8"/>
    <line x1="374.4" y1="53.0" x2="374.4" y2="75.0" stroke="#ffffff" stroke-width="3.0"/>
    <text x="145" y="70.0" class="blab" text-anchor="end">Elpis</text>
    <text x="935" y="70.0" class="bval" fill="#34d399">68.8k</text>
  </g>

  <!-- Summary Footnote -->
  <text x="40" y="462" fill="#94a3b8" font-size="13.5">Across all three independent runs, Elpis's median context usage remains tightly stabilized between <tspan fill="#34d399" font-weight="700">68.8k and 69.6k tokens (26.6%–27.0%)</tspan>, whereas Codex expands past 240k tokens.</text>
</svg>