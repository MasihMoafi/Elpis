<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Elpis immutable audit trail</title>
  <desc id="desc">A horizontal audit flow from evidence review to immutable audit writing and selective pruning, with the audit record branching to three evidence artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1621"/>
      <stop offset="1" stop-color="#101b28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#718096"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#7bd6a3"/>
    </marker>
  </defs>

  <rect width="1200" height="850" fill="url(#bg)"/>
  <text x="100" y="52" fill="#8ea2b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">AUDITABILITY</text>
  <text x="100" y="88" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700">Every pruning pass leaves evidence</text>
  <text x="100" y="116" fill="#9aaabd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">The audit is written before the working context is changed.</text>

  <g stroke="#718096" stroke-width="2" marker-end="url(#arrow)">
    <line x1="360" y1="258" x2="420" y2="258"/>
    <line x1="780" y1="258" x2="840" y2="258"/>
    <line x1="600" y1="316" x2="600" y2="410"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="100" y="200" width="260" height="116" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <circle cx="136" cy="236" r="15" fill="#718096"/>
    <text x="136" y="242" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">1</text>
    <text x="168" y="238" fill="#f4f7fb" font-size="18" font-weight="700">Review evidence</text>
    <text x="132" y="276" fill="#a7b5c5" font-size="14">Eligible old tool output</text>
    <text x="132" y="298" fill="#a7b5c5" font-size="14">is identified for review.</text>

    <rect x="420" y="200" width="360" height="116" rx="16" fill="#15343d" stroke="#39c6d8" stroke-width="2"/>
    <circle cx="456" cy="236" r="15" fill="#39c6d8"/>
    <text x="456" y="242" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">2</text>
    <text x="488" y="238" fill="#f4f7fb" font-size="18" font-weight="700">Write immutable audit</text>
    <text x="452" y="276" fill="#b5e8ed" font-size="14">Before working-history</text>
    <text x="452" y="298" fill="#b5e8ed" font-size="14">mutation takes place.</text>

    <rect x="840" y="200" width="260" height="116" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <circle cx="876" cy="236" r="15" fill="#718096"/>
    <text x="876" y="242" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">3</text>
    <text x="908" y="238" fill="#f4f7fb" font-size="18" font-weight="700">Selective pruning</text>
    <text x="872" y="276" fill="#a7b5c5" font-size="14">Apply the recorded</text>
    <text x="872" y="298" fill="#a7b5c5" font-size="14">decision to context.</text>

    <rect x="350" y="410" width="500" height="88" rx="16" fill="#20382d" stroke="#7bd6a3" stroke-width="2"/>
    <text x="600" y="446" fill="#f4f7fb" font-size="18" font-weight="700" text-anchor="middle">~/.elpis/logs/pruning/passes/&lt;pass-id&gt;/</text>
    <text x="600" y="473" fill="#c2ebcd" font-size="14" text-anchor="middle">One immutable record for this pruning pass</text>

    <path d="M 600 498 L 600 570 L 260 570 L 260 624" fill="none" stroke="#7bd6a3" stroke-width="2" marker-end="url(#greenArrow)"/>
    <path d="M 600 570 L 600 624" fill="none" stroke="#7bd6a3" stroke-width="2" marker-end="url(#greenArrow)"/>
    <path d="M 600 570 L 940 570 L 940 624" fill="none" stroke="#7bd6a3" stroke-width="2" marker-end="url(#greenArrow)"/>

    <rect x="100" y="624" width="320" height="100" rx="16" fill="#17212b" stroke="#7bd6a3" stroke-width="1.5"/>
    <text x="132" y="666" fill="#9de0b6" font-size="17" font-weight="700">ace.json</text>
    <text x="132" y="694" fill="#a7b5c5" font-size="14">Instructions, input, raw response</text>

    <rect x="440" y="624" width="320" height="100" rx="16" fill="#17212b" stroke="#7bd6a3" stroke-width="1.5"/>
    <text x="472" y="666" fill="#9de0b6" font-size="17" font-weight="700">manifest.json</text>
    <text x="472" y="694" fill="#a7b5c5" font-size="14">Reviewed calls and decisions</text>

    <rect x="780" y="624" width="320" height="100" rx="16" fill="#17212b" stroke="#7bd6a3" stroke-width="1.5"/>
    <text x="812" y="666" fill="#9de0b6" font-size="17" font-weight="700">items/*.json</text>
    <text x="812" y="694" fill="#a7b5c5" font-size="14">Before / after representations</text>
  </g>
</svg>
