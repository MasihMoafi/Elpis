<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Elpis session continuity modes</title>
  <desc id="desc">After a restart or provider change, Elpis can continue through the provider-native thread or through portable Markdown checkpoints in a fresh thread.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1621"/><stop offset="1" stop-color="#101b28"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="#718096"/></marker>
  </defs>
  <rect width="1200" height="850" fill="url(#bg)"/>
  <text x="100" y="52" fill="#8ea2b8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">SESSION CONTINUITY</text>
  <text x="100" y="88" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="29" font-weight="700">Two ways to continue work</text>
  <text x="100" y="116" fill="#9aaabd" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16">Exact resume preserves a provider thread; lean continuation preserves portable state.</text>

  <g stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M600 260 L600 300 L300 300 L300 350"/>
    <path d="M600 300 L900 300 L900 350"/>
    <line x1="300" y1="580" x2="300" y2="650"/>
    <line x1="900" y1="580" x2="900" y2="650"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <rect x="300" y="170" width="600" height="90" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <circle cx="340" cy="215" r="16" fill="#718096"/>
    <text x="340" y="221" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">1</text>
    <text x="380" y="209" fill="#f4f7fb" font-size="21" font-weight="700">Continue after restart or provider change</text>
    <text x="380" y="237" fill="#a7b5c5" font-size="14">Choose the continuation source for the next thread.</text>

    <rect x="100" y="350" width="400" height="230" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <circle cx="140" cy="394" r="16" fill="#718096"/>
    <text x="140" y="400" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">A</text>
    <text x="180" y="389" fill="#f4f7fb" font-size="21" font-weight="700">Exact resume</text>
    <text x="140" y="436" fill="#a7b5c5" font-size="15">Provider-native thread</text>
    <text x="140" y="466" fill="#a7b5c5" font-size="14">Full accumulated history</text>
    <text x="140" y="493" fill="#a7b5c5" font-size="14">Provider-bound</text>
    <line x1="140" y1="518" x2="460" y2="518" stroke="#344354" stroke-width="1"/>
    <text x="140" y="548" fill="#8ea2b8" font-size="13">Evidence: provider transcript on disk</text>

    <rect x="700" y="350" width="400" height="230" rx="16" fill="#15343d" stroke="#39c6d8" stroke-width="2"/>
    <circle cx="740" cy="394" r="16" fill="#39c6d8"/>
    <text x="740" y="400" fill="#0e1621" font-size="15" font-weight="800" text-anchor="middle">B</text>
    <text x="780" y="389" fill="#f4f7fb" font-size="21" font-weight="700">Lean continuation</text>
    <text x="740" y="436" fill="#b5e8ed" font-size="15">Fresh thread, re-anchored</text>
    <text x="740" y="466" fill="#b5e8ed" font-size="14">GOAL.md · ES.md · admission.toml</text>
    <text x="740" y="493" fill="#b5e8ed" font-size="14">Bounded and provider-neutral</text>
    <line x1="740" y1="518" x2="1060" y2="518" stroke="#2b6670" stroke-width="1"/>
    <text x="740" y="548" fill="#8ed9df" font-size="13">Evidence: transcript plus portable checkpoint</text>

    <rect x="100" y="650" width="400" height="90" rx="16" fill="#17212b" stroke="#718096" stroke-width="1.5"/>
    <text x="300" y="688" fill="#f4f7fb" font-size="18" font-weight="700" text-anchor="middle">Original provider thread</text>
    <text x="300" y="716" fill="#a7b5c5" font-size="14" text-anchor="middle">Resume exact history</text>

    <rect x="700" y="650" width="400" height="90" rx="16" fill="#20382d" stroke="#7bd6a3" stroke-width="2"/>
    <text x="900" y="688" fill="#f4f7fb" font-size="18" font-weight="700" text-anchor="middle">Portable checkpoint</text>
    <text x="900" y="716" fill="#c2ebcd" font-size="14" text-anchor="middle">Start fresh without losing the thread</text>

    <rect x="300" y="780" width="600" height="44" rx="12" fill="#3a3022" stroke="#d6a85f" stroke-width="1.5"/>
    <text x="600" y="808" fill="#ead5aa" font-size="13" text-anchor="middle">No automatic tier-switching state machine is enabled today.</text>
  </g>
</svg>
