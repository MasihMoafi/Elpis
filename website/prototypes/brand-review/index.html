<!doctype html><html lang="en" data-theme="elpis"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elpis · logo preview</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../assets/branding/brand.css?v=review-20261014"><style>body{margin:0;background:var(--color-base-100);color:var(--color-base-content);font-family:Inter,system-ui,sans-serif}main{max-width:640px;margin:8vh auto;padding:24px}h1{font-size:24px;font-weight:500;letter-spacing:-.03em}.logo-stage{display:grid;place-items:center;width:100%;height:240px;margin:28px 0;border:1px solid var(--color-base-300);border-radius:12px;background:var(--color-base-200)}.logo-stage img{width:min(360px,78%);height:auto}.controls{display:flex;gap:12px}p{color:color-mix(in srgb,var(--color-base-content) 65%,transparent);font-size:14px;line-height:1.5}a{display:inline-block;margin-top:28px;font-size:14px}</style></head><body><main><h1>The E is part of the name.</h1><div class="logo-stage"><img id="mark" src="../../assets/branding/elpis-wordmark-amber-loop.svg" alt="Elpis" width="360" height="168"></div><div class="controls"><button class="btn btn-ghost" id="replay">Replay</button><button class="btn btn-ghost" id="theme">Day</button></div><p>The letters arrive in sequence. A light sweep repeats while the word stays visible.</p><a class="link" href="../../index.html?review=20261014">See the revised page →</a></main><script>let light=false;const mark=document.querySelector('#mark');function source(){return '../../assets/branding/elpis-wordmark-amber'+(light?'-light':'')+'-loop.svg'}document.querySelector('#replay').addEventListener('click',()=>mark.src=source()+'?replay='+Date.now());document.querySelector('#theme').addEventListener('click',e=>{light=!light;document.documentElement.dataset.theme=light?'elpis-light':'elpis';mark.src=source();e.target.textContent=light?'Night':'Day';});</script></body></html>
